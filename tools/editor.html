<!doctype html>
<meta charset="utf-8">
<title>Editor de mapas — Thaira</title>
<style>
  :root {
    --bg: #12100e; --painel: #1b1815; --linha: #2e2822; --texto: #d8cdb8;
    --fraco: #8a7f6d; --ouro: #d8c27a; --perigo: #b4553a; --bom: #6f9a52;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--texto); overflow: hidden;
         font: 13px/1.5 ui-sans-serif, system-ui, sans-serif;
         display: grid; grid-template-rows: auto auto 1fr auto; }
  h1 { font: 600 15px/1.2 ui-serif, Georgia, serif; color: var(--ouro); margin: 0; display: inline; }
  header { padding: 7px 12px; border-bottom: 1px solid var(--linha); }
  header span { color: var(--fraco); margin-left: 10px; font-size: 12px; }
  .barra { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
           padding: 6px 12px; border-bottom: 1px solid var(--linha); background: var(--painel); }
  .sep { width: 1px; height: 20px; background: var(--linha); }
  button, input[type=text] {
    background: #241f1a; color: var(--texto); border: 1px solid var(--linha);
    padding: 3px 8px; font: inherit; cursor: pointer; border-radius: 0; }
  button.on { background: var(--ouro); color: #17140f; border-color: var(--ouro); }
  button:hover:not(.on) { border-color: var(--fraco); }
  button b { font-weight: 600; opacity: .5; margin-left: 5px; font-size: 10.5px;
             font-family: ui-monospace, monospace; }
  button.on b { opacity: .65; }
  input[type=range] { width: 88px; accent-color: var(--ouro); vertical-align: middle; }
  .barra label { color: var(--fraco); font-size: 12px; }
  #densN { color: var(--texto); font-family: ui-monospace, monospace; min-width: 32px;
           display: inline-block; text-align: right; }

  .palco { display: grid; grid-template-columns: 214px 1fr; min-height: 0; }
  #paleta { border-right: 1px solid var(--linha); overflow-y: auto; padding: 6px 6px 20px;
            background: var(--painel); }
  .grupo { color: var(--ouro); font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase;
           margin: 10px 2px 4px; border-bottom: 1px solid var(--linha); padding-bottom: 2px; }
  .grupo:first-child { margin-top: 2px; }
  .linhas { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
  .tl { display: flex; align-items: center; gap: 5px; padding: 2px 4px; font-size: 11px;
        border: 1px solid transparent; cursor: pointer; user-select: none; }
  .tl:hover { border-color: var(--linha); }
  .tl.on { border-color: var(--ouro); background: #2a241c; }
  .sw { width: 32px; height: 32px; border: 1px solid #0007; flex: none;
        image-rendering: pixelated; background: #14110d; }
  .sw.barra { box-shadow: inset 0 0 0 2px #0009; }
  .tl span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }

  .visor { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: #0a0908; }
  canvas { display: block; image-rendering: pixelated; cursor: crosshair; }
  canvas.pan { cursor: grabbing; }
  #log { position: absolute; right: 10px; bottom: 10px; width: 46ch; max-height: 44%;
         overflow: auto; font-family: ui-monospace, monospace; font-size: 11px; line-height: 1.45;
         color: var(--fraco); background: #17140fe8; border: 1px solid var(--linha);
         padding: 7px 9px; margin: 0; white-space: pre-wrap; }
  #log:empty { display: none; }
  #log.ruim { border-color: var(--perigo); color: #e0b3a4; }

  .rodape { display: flex; gap: 16px; align-items: center; padding: 4px 12px;
            border-top: 1px solid var(--linha); background: var(--painel);
            font-family: ui-monospace, monospace; font-size: 11.5px; color: var(--fraco); }
  .rodape .dica { margin-left: auto; opacity: .8; }
  .aviso { color: var(--perigo); }
  .ok { color: var(--bom); }
</style>

<script>
/* O CONTRATO DE ESTADO DO RENDER, e ele é pequeno de propósito.
   O editor desenha o mundo chamando o `drawWorld` DO JOGO — não uma cópia. Um
   laço de desenho próprio aqui divergiria do render2d.js no primeiro objeto
   novo, e aí o editor mostraria uma coisa e o jogo outra: pior que a planta
   chapada, porque a planta ao menos não promete ser o jogo.
   O preço é declarar o `P` e o `G` que o render lê. São 7 campos e 13, todos
   listados abaixo; se o render passar a precisar de mais, isto quebra alto
   (undefined) em vez de desenhar errado calado. O que fica vazio é o que é
   estado de PARTIDA e não de mapa: criatura, projétil, sangue, corpo, campo. */
var P = { x: 0, y: 0, z: 0, px: 0, py: 0, lastDir: 's', voc: 'knight', eq: {}, seen: {} };
var G = { now: 0, real: 0, abalo: null, blood: [], campos: [], corpses: [], drops: [],
          fx: [], hover: null, mobs: [], nascendo: [], proj: [], target: null };
/* E o punhado de funções do game.js que o render chama no caminho SEMPRE
   executado. Não vale carregar o game.js inteiro por elas: viria save, loja,
   HUD e o laço de jogo junto, e o editor passaria a depender de tudo o que o
   jogo depende. Cada stub aqui é uma linha e diz o que o editor não tem.
   `luzCarregada` é a tocha na mochila do personagem — no editor não há mochila,
   então a resposta é "nenhuma luz", e quem ilumina é só o ambiente do andar. */
function luzCarregada() { return { r: 0, cor: '#000', a0: 0, a1: 0, magica: false }; }
</script>
<script src="../src/render2d.js"></script>
<script>
/* O editor carrega o world.js DE VERDADE, como a planta faz. A paleta, as cores
   e o mapa saem da fonte única — copiar id ou cor para cá criaria a segunda
   fonte de verdade que a virada de mundo existe para não ter, e a página
   mentiria no dia seguinte. */
const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d');

/* CÂMERA. A primeira versão dimensionava o canvas em W*px e desenhava o mapa
   inteiro: no zoom 8 isso dava 1536 px de canvas, que transbordava a página e
   empurrava tudo para o canto — e mudar o zoom redesenhava a partir de (0,0),
   então o que você estava olhando saía voando. Agora o canvas é uma JANELA do
   tamanho do visor, `cam` é o tile do canto superior esquerdo, e o zoom é
   ancorado no cursor. É o mesmo modelo do jogo, e pela mesma razão. */
/* `ecamX/ecamY` e não `camX`: o render2d.js declara `camX` no escopo de script,
   e os dois arquivos dividem esse escopo — declarar o mesmo nome duas vezes
   derruba a página inteira com SyntaxError antes de qualquer linha rodar. */
let z = 0, px = 4, ecamX = 0, ecamY = 0;
/* VISTA. `jogo` desenha pelo render do jogo — é o que o dono do projeto pediu:
   ver como vai ficar sem ter que jogar. `planta` é a cor chapada por tile, e
   continua existindo porque no zoom de navegação (2–6 px por tile) o render do
   jogo não se lê e custa caro: para achar uma região do outro lado do mapa a
   planta é a ferramenta certa. Tecla V. */
let vista = 'jogo';
/* ABAIXO DESTE TAMANHO a vista de jogo cai para a planta, sozinha. Ela desenha
   tile a tile, então o custo cresce com o QUADRADO do afastamento: medido nesta
   máquina, 7 ms por quadro a 48 px por tile, 10 a 24, 56 a 11, 139 a 6, 243 a
   3,7 e 486 a 2,2 — e a 486 ms o editor não responde ao mouse.
   O limiar é 12 px porque é onde a conta ainda cabe num quadro razoável, e
   porque abaixo disso a arte não se lê de qualquer jeito: um tile de 32 px
   desenhado em 8 não mostra nem a junta nem a silhueta, que são as duas coisas
   pelas quais a vista de jogo existe. A planta, que é uma cor por tile, atravessa
   o mapa inteiro sem suar — cada vista serve ao zoom em que ela é a ferramenta
   certa. A barra de estado diz qual está valendo e por quê. */
const VISTA_MIN = 12;
const vistaAgora = () => (vista === 'jogo' && px >= VISTA_MIN) ? 'jogo' : 'planta';
/* LUZ. `andar` é a do FLOOR_AMBIENCE — fiel, e é onde a arte se julga: aprovar
   tile de caverna em luz de meio-dia o deixa escuro demais para onde ele mora.
   `neutra` é chapada, e existe porque num andar escuro não se ENXERGA o que se
   está pintando. As duas numa tecla porque a resposta muda conforme se esteja
   desenhando ou julgando. Tecla L. */
let luz = 'andar';
/* GRADE. Era automática — aparecia a partir de 7 px por tile e sumia abaixo —,
   e automática está errado desde que existe a vista de jogo: sobre a arte a
   grade RABISCA (é linha preta em cima de cada tile desenhado), e sobre a
   planta ela é metade do trabalho, porque contar tile é como se acerta uma
   coordenada. Quem decide é o dono, na tecla X.
   São DUAS grades e o X passa pelas duas, em ciclo de três estados, porque a
   segunda atrapalha pelo mesmo motivo que a primeira: a marca de ouro do que
   você mexeu vira uma grade amarela em cima da região recém-pintada, que é
   justamente onde se quer olhar o tile. Um botão só, porque a pergunta é uma
   só — "quanto rabisco por cima da arte?" — e dois botões fariam o dono lembrar
   de qual é qual.
   O padrão continua sendo o comportamento antigo, agora explícito: as duas
   ligadas, e a do mapa ainda escondida abaixo de 7 px, onde viraria ruído. */
const GRADES = ['as duas', 'só a de edição', 'nenhuma'];
let grade = 0;                     // índice em GRADES: 0 = padrão
const gradeMapa = () => grade === 0;
const gradeEdicao = () => grade < 2;
const dpr = () => Math.max(1, Math.round(devicePixelRatio || 1));

/* A troca de luz por cima do `ambienteAgora`, que é declaração de função e
   portanto vive no objeto global — dá para envolver sem tocar no motor. */
const ambienteReal = ambienteAgora;
/* MEIO-DIA FIXO no modo fiel, e não a hora de verdade. O `ambienteAgora` lê
   `Date.now()`, então abrir o editor às oito da noite dava a ilha inteira no
   escuro — medido: brilho médio 37 contra 88. Julgar cor de noite é o erro que
   o CLAUDE.md já proíbe em texto ("de noite a iluminação mascara a paleta e
   qualquer avaliação de cor sai errada"), e num editor ele é pior ainda: não é
   só o julgamento que se perde, é a edição, porque não se enxerga o que se
   pinta. O andar de subsolo continua com a luz DELE — lá o escuro é da tabela e
   não do relógio, e é onde o tile de caverna tem de ser julgado. */
const meioDia = () => Math.floor(Date.now() / DIA_MS) * DIA_MS + DIA_MS * 0.5;
window.ambienteAgora = function (zz, ms) {
  if (luz === 'andar') return ambienteReal(zz, ms === undefined ? meioDia() : ms);
  /* `amb: null` é "não escurece nada" — o máximo de brilho HONESTO, porque
     acima disso o editor estaria clareando a arte e mentindo sobre ela. */
  return { bg: '#1a1712', amb: null, escuro: 0 };
};

/* CLIMA PARADO, SEMPRE. O editor não anima: o mapa é estático e o que se está
   fazendo é desenhar, não jogar. Medido antes: dois desenhos seguidos sem tocar
   em nada diferiam em 13.365 pixels — `G.now` está congelado, mas nuvem, chuva,
   raio e vento saem do relógio REAL (`Date.now`), e continuavam correndo por
   baixo. Sombra de nuvem passando por cima do tile que se está pintando é ruído
   puro, e relâmpago no meio de uma edição é pior.
   Reusa o `CLIMA_PARADO` que o motor já aplica em andar coberto — inventar um
   estado de clima só para o editor seria uma segunda régua de tempo. */
const climaReal = climaAgora;
window.climaAgora = function () { return CLIMA_PARADO; };
let pincel = T.GRASS, ferramenta = 'pincel', raio = 0, forma = 'quadrado', dens = 100;
/* QUEM ESTÁ CARREGADO, que não é o mesmo que o que está escrito na caixinha.
   O `gravar` lia o campo de texto, então bastava trocar o nome depois de editar
   (ou digitar e apertar Ctrl+S) para as correções de UM mapa serem gravadas no
   patch de OUTRO — com as coordenadas calculadas com o W do primeiro. A caixa
   escolhe o que CARREGAR; quem manda no gravar é o que está na tela. */
let carregado = null;
let base = null;                 // o mapa como o script o deixou, para o diff
let mexidos = new Map();         // "z:i" -> tile, só o que difere da base
/* A SEGUNDA CAMADA tem o próprio diff, e a unidade dele é a LISTA de objetos
   ancorados num tile — não o objeto solto. É o que cobre pôr, tirar e vários
   por tile com uma forma só: quem grava viu o tile inteiro e decidiu por ele.
   `pincelObj` null = pintando terreno; string = pintando objeto; '' = borracha,
   que é "pintar NENHUM objeto" e por isso não precisa de ferramenta nova. */
let baseObj = null;
let mexidosObj = new Map();      // "z:i" -> [ids], só o que difere de baseObj
let pincelObj = null;
let pilha = [];                  // desfazer: cada traço é um lote
let arrastando = null, panning = null, hover = null;

/* ------------------------------------------------- a forma do pincel
   Um lugar só decide QUAIS tiles o pincel acerta, e tanto a pintura quanto a
   marca sob o cursor leem dele — duas listas divergiriam, e aí a marca mentiria
   sobre onde a tinta cai, que é o defeito que um editor não pode ter.

   A mancha morde o raio com ruído do MAPA e não com sorteio do traço: com o
   ruído amarrado a (x,y), a marca mostra exatamente o contorno que vai cair, e
   arrastar não carimba a mesma bolha repetida — a borda muda porque o lugar
   mudou. */
/* [PINCEL] daqui até a marca de fecho o bloco não toca em DOM nem em mapa, e o
   tests/test_tools.js o recorta por estas duas marcas para exercitá-lo no node.
   Mexer nelas quebra o teste alto, que é o que se quer. */
/* `>>>` e não `>>` no ÚLTIMO deslocamento, e `Math.imul` no produto. Com o
   deslocamento COM sinal, `n ^ (n >> 16)` zera o bit 31 sempre — o hash saía na
   faixa [0, .5) em vez de [0, 1), a mancha ficava com dois terços da área do
   círculo e nada acusava, porque um ruído enviesado ainda parece ruído.
   Medido: o deslocamento do meio (13) é uniforme com sinal ou sem, então só
   este último carrega significado — o outro está sem sinal por consistência. */
const _hxy = (x, y) => {
  let n = Math.imul(x, 374761393) + Math.imul(y, 668265263) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
};
const RUIDO_CEL = 3;               // tiles por célula do ruído: a escala da mordida
function ruido(x, y) {
  const fx = x / RUIDO_CEL, fy = y / RUIDO_CEL;
  const ix = Math.floor(fx), iy = Math.floor(fy), tx = fx - ix, ty = fy - iy;
  const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
  const a = _hxy(ix, iy) + (_hxy(ix + 1, iy) - _hxy(ix, iy)) * sx;
  const b = _hxy(ix, iy + 1) + (_hxy(ix + 1, iy + 1) - _hxy(ix, iy + 1)) * sx;
  return a + (b - a) * sy;
}

/* `espalha` separa o CONTORNO da DENSIDADE porque a marca sob o cursor precisa
   do contorno inteiro: a densidade sorteia a cada clique, então mostrar o
   resultado dela seria mostrar um sorteio que não vai se repetir. A marca diz
   "aqui pode cair"; a pintura decide quantos caem. */
function celulas(cx, cy, espalha) {
  /* O 1×1 escapa de forma e densidade: pincel de um tile que às vezes não pinta
     é ferramenta quebrada, não spray. */
  if (!raio) return [[cx, cy]];
  const R = forma === 'mancha' ? raio + 2 : raio, out = [];
  for (let j = -R; j <= R; j++) for (let i = -R; i <= R; i++) {
    const x = cx + i, y = cy + j;
    if (forma !== 'quadrado') {
      /* A mordida vai de .72 a 1.28 do raio, centrada em 1: trocar de círculo
         para mancha muda o CONTORNO e não o tamanho do pincel. Com a faixa
         começando mais baixa a mancha saía com metade da área do círculo, e o
         botão passava a fazer duas coisas de uma vez. */
      const lim = forma === 'mancha' ? (raio + .5) * (.72 + .56 * ruido(x, y)) : raio + .5;
      if (Math.hypot(i, j) > lim) continue;
    }
    if (espalha && dens < 100 && Math.random() * 100 >= dens) continue;
    out.push([x, y]);
  }
  return out;
}
/* [/PINCEL] */

const chave = (zz, i) => zz + ':' + i;
const nomeTile = t => Object.keys(T).find(k => T[k] === t) || String(t);
const cssCor = t => '#' + TILE[t].c.toString(16).padStart(6, '0');
const trava = (v, a, b) => Math.max(a, Math.min(b, v));

/* ------------------------------------------------------ amostra da paleta
   O que se escolhe na paleta tem de ser o que vai aparecer no mapa. Quadradinho
   de cor chapada dizia o mínimo — dois tons de marrom não contam qual é a
   tábua e qual é a terra batida, e objeto nenhum tem silhueta numa amostra de
   14 px de cor sólida.
   Aqui sai o MESMO sprite que o render desenha: `tileTexture` para terreno,
   `wallSprite`/`PAREDE_DRAW` para parede, `OBJ_DRAW` para móvel e
   `decoSprite` para planta. Nada de arte própria do editor — uma segunda arte
   aqui envelheceria no primeiro tile redesenhado, e a paleta passaria a mentir
   sobre o que ela põe no mapa. */
const AM = 32;
function amostraCanvas(desenhar) {
  const c = document.createElement('canvas');
  c.width = c.height = AM; c.className = 'sw';
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  try { desenhar(g, c); } catch (e) { /* tile sem rotina de desenho: fica o fundo */ }
  return c;
}
/* O ENQUADRAMENTO decide se a amostra serve. A primeira versão encaixava o
   sprite inteiro dentro do quadrado preservando proporção — e como parede e
   móvel são mais ALTOS que largos (têm o topo que transborda para o tile de
   trás), o desenho encolhia para uns 65% da largura e sobrava fundo dos dois
   lados. Medidas, as dezesseis amostras davam médias de cor praticamente
   iguais: o fundo dominava e nenhuma silhueta se lia.
   Agora: quem cabe num tile é desenhado com a LARGURA cheia e alinhado pelo
   PÉ, como no jogo — o topo que sobra é cortado em cima, que é exatamente o que
   acontece na tela quando há outro tile acima. Quem ocupa mais de um tile
   (moinho, poço) entra inteiro, senão sobraria só o rodapé e a coisa perderia
   justamente a silhueta que a distingue. */
function encaixa(g, spr) {
  if (spr.width > 32) {                         // multi-tile: inteiro, ou vira rodapé
    const k = Math.min(AM / spr.width, AM / spr.height);
    const w = Math.round(spr.width * k), h = Math.round(spr.height * k);
    g.drawImage(spr, Math.round((AM - w) / 2), AM - h, w, h);
    return;
  }
  const k = AM / 32;                            // largura cheia do tile
  const w = Math.round(spr.width * k), h = Math.round(spr.height * k);
  g.drawImage(spr, Math.round((AM - w) / 2), AM - h, w, h);
}
function amostraTile(t) {
  const def = TILE[t];
  return amostraCanvas(g => {
    if (def.hide) { g.fillStyle = '#000'; g.fillRect(0, 0, AM, AM); return; }
    if (def.tex) g.drawImage(tileTexture(def.tex, def.c), 0, 0, 32, 32, 0, 0, AM, AM);
    else { g.fillStyle = cssCor(t); g.fillRect(0, 0, AM, AM); }
    if (t === T.UP || t === T.DOWN) g.drawImage(stairSprite(t === T.DOWN), 0, 0, AM, AM);
  });
}
function amostraObj(id) {
  const d = OBJ[id];
  return amostraCanvas(g => {
    /* Chão neutro por baixo: o objeto é transparente em volta, e sem fundo a
       silhueta some contra o painel. Terra batida porque é o chão mais comum
       debaixo de móvel e cerca. */
    g.drawImage(tileTexture('dirt', TILE[T.DIRT].c), 0, 0, 32, 32, 0, 0, AM, AM);
    if (d.deco !== undefined) return encaixa(g, outlined(decoSprite(d.deco, 0)));
    if (d.draw === 'porta') return g.drawImage(tileTexture('door', d.c), 0, 0, 32, 32, 0, 0, AM, AM);
    if (d.draw && PAREDE_DRAW[d.draw]) return encaixa(g, PAREDE_DRAW[d.draw]());
    if (d.draw && OBJ_DRAW[d.draw]) return encaixa(g, OBJ_DRAW[d.draw](false));
    if (d.top > 0.5) return encaixa(g, wallSprite(d.tex, d.c, 0));
  });
}

/* --------------------------------------------------------------- a paleta
   Agrupada, e não uma lista de 39 nomes em ordem de id. Trinta e nove itens em
   duas colunas sem ordem que se leia é um índice, não uma paleta: para achar
   CROP você lia a lista inteira. Os grupos são os do vocabulário do #48, que é
   como os tiles foram pensados. */
/* OS QUATORZE QUE SAÍRAM DAQUI, e sair é o conserto, não a perda.
   `ROCK`, `TREE`, `CWALL`, `WALL`, `DOOR`, `FENCE`, `PROP`, `SWALL`, `ORE`,
   `WEB`, `WELL`, `CART`, `BARREL` e `MILL` continuam existindo em `T` — eles são
   o VOCABULÁRIO DE AUTOR, o que permite o script escrever
   `C.espalha(m, S, T.TREE, ...)`. O que eles não são é TILE: o `parteCamadas` os
   desce para a camada de objeto. Na paleta eram armadilha por três motivos,
   todos medidos:
     · a amostra desenhava o CHÃO deles — "árvore" saía como grama e "barril"
       como terra, com distância de cor ZERO contra GRASS e DIRT;
     · pintar com eles não mostrava nada, porque o mapa carregado já está
       partido e o objeto só nasce na recomposição seguinte;
     · e os quatorze JÁ estão na paleta de objeto, com o sprite de verdade.
   Duas entradas para a mesma coisa, e a pior das duas aparecia primeiro. */
const GRUPOS = [
  ['chão · campo',   ['GRASS', 'DIRT', 'SAND', 'CROP', 'HAY']],
  ['chão · variante',['GRASS_CLARA', 'GRASS_MATA', 'GRASS_SECA', 'GRASS_RALA', 'DIRT_ESCURA']],
  ['chão · água',    ['WATER', 'SWAMP', 'LAVA']],
  ['chão · vila',    ['PAVE', 'FLOOR', 'PIER', 'TEMPLE', 'RUBBLE']],
  ['chão · subsolo', ['CFLOOR', 'GRAVEL', 'WEBF', 'BONE', 'ASH', 'MOSS', 'SNOW']],
  ['marcas',         ['GORE', 'RUNE', 'VOID']],
  ['escadas',        ['UP', 'DOWN']],
  /* A folha `tiles_01.png`, agrupada por família — 55 entradas numa lista
     corrida seriam um índice, não uma paleta. */
  ['folha 01 · grama', ['GRASS_DENSA', 'GRASS_FLORIDA', 'GRASS_PEDRA', 'GRASS_ALTA', 'GRASS_PAPOULA', 'GRASS_MOSTARDA', 'GRASS_MATO_SECO', 'GRASS_ARBUSTO']],
  ['folha 01 · terra', ['DIRT_UMIDA', 'DIRT_LISA', 'DIRT_PEDRISCO', 'DIRT_RACHADA', 'DIRT_PEDREGOSA', 'DIRT_GRETADA']],
  ['folha 01 · areia', ['SAND_FINA', 'SAND_GROSSA', 'SAND_PEDRA', 'SAND_MATO', 'SAND_DUNA']],
  ['folha 01 · calçada', ['PAVE_BLOCO', 'PAVE_SEIXO', 'PAVE_CLARA', 'PAVE_MUSGO', 'PAVE_PARALELO', 'PAVE_LAJE', 'PAVE_MOSAICO']],
  ['folha 01 · tijolo', ['BRICK', 'BRICK_MUSGO']],
  ['folha 01 · água', ['WATER_CLARA', 'WATER_FUNDA']],
  ['folha 01 · pedra', ['ROCK_IRREGULAR', 'ROCK_PEDREGULHO', 'ROCK_BASALTO', 'ROCK_MUSGO']],
  ['folha 01 · brita', ['GRAVEL_CLARO']],
  ['folha 01 · tábua', ['FLOOR_DEITADA', 'FLOOR_CLARA', 'FLOOR_ESCURA', 'FLOOR_TRAVESSA', 'FLOOR_LARGA']],
  ['folha 01 · tapete', ['RUG']],
  ['folha 01 · osso', ['BONE_CHAO', 'BONE_AREIA']],
  ['folha 01 · lava', ['LAVA_VIVA']],
  ['folha 01 · neve', ['SNOW_PEDRA', 'SNOW_MATO', 'SNOW_FUNDA']],
  ['folha 01 · gelo', ['ICE_AGUA', 'ICE_TRINCADO', 'ICE_LISO']],
  ['folha 01 · pântano', ['SWAMP_VITORIA', 'SWAMP_JUNCO_SECO', 'SWAMP_JUNCO', 'SWAMP_FOLHA']]
];
/* Os objetos, agrupados pela mesma lógica do vocabulário. A borracha entra como
   entrada da paleta e não como ferramenta: apagar É pintar nenhum objeto, e uma
   ferramenta a mais seria um modo a mais para o dono lembrar. */
const GRUPOS_OBJ = [
  ['objeto · apagar', ['']],
  ['objeto · parede', ['ptabua', 'pbloco', 'rochedo', 'cparede', 'veio', 'teia', 'moinho']],
  ['objeto · vila',   ['porta', 'cerca', 'poco', 'carroca', 'barril', 'escora']],
  ['objeto · mato',   ['arvore', 'moita', 'pedra']]
];
/* Selecionar não reconstrói a paleta: só troca a marca. Reconstruir redesenha
   115 sprites de 32×32 — medido em 11,8 ms, o dobro do que custa desenhar o
   mapa inteiro — e isso acontecia a cada clique na paleta. */
function marcaPaleta() {
  for (const d of document.querySelectorAll('#paleta .tl')) {
    const t = d.dataset.tile, o = d.dataset.obj;
    const on = o !== undefined ? pincelObj === o
                               : (pincelObj === null && +t === pincel);
    d.classList.toggle('on', on);
  }
}
function paleta() {
  const p = $('#paleta');
  p.innerHTML = '';
  const postos = new Set();
  const bloco = (titulo, nomes) => {
    const h = document.createElement('div'); h.className = 'grupo'; h.textContent = titulo;
    const g = document.createElement('div'); g.className = 'linhas';
    for (const nome of nomes) {
      if (T[nome] === undefined) continue;
      postos.add(nome);
      const t = T[nome], d = document.createElement('div');
      d.className = 'tl' + (t === pincel && pincelObj === null ? ' on' : '');
      const am = amostraTile(t);
      if (!TILE[t].walk) am.classList.add('barra');
      d.appendChild(am);
      const rot = document.createElement('span'); rot.textContent = nome.toLowerCase();
      d.appendChild(rot);
      d.title = nome + ' · ' + (TILE[t].walk ? 'andável' : 'barra o passo') +
        (TILE[t].span ? ' · ocupa ' + TILE[t].span[0] + '×' + TILE[t].span[1] + ' tiles' : '');
      d.dataset.tile = t;
      d.onclick = () => { pincel = t; pincelObj = null; marcaPaleta(); desenha(); };
      g.appendChild(d);
    }
    p.appendChild(h); p.appendChild(g);
  };
  const blocoObj = (titulo, ids) => {
    const h = document.createElement('div'); h.className = 'grupo'; h.textContent = titulo;
    const g = document.createElement('div'); g.className = 'linhas';
    for (const id of ids) {
      const d = document.createElement('div');
      d.className = 'tl' + (pincelObj === id ? ' on' : '');
      const o = OBJ[id];
      if (id === '') {
        const vazio = document.createElement('span');
        vazio.className = 'sw';
        vazio.style.cssText = 'border:1px dashed #8a7a5c;background:transparent';
        d.appendChild(vazio);
      } else {
        const am = amostraObj(id);
        if (!o.walk) am.classList.add('barra');
        d.appendChild(am);
      }
      const rot = document.createElement('span');
      rot.textContent = id === '' ? 'apagar' : o.nome.toLowerCase();
      d.appendChild(rot);
      d.title = id === '' ? 'tira todo objeto do tile — o chão fica'
        : o.nome + ' · ' + (o.walk ? 'não barra' : 'barra o passo') +
          (o.top > 0.5 ? ' e a vista' : '') +
          (o.span ? ' · ocupa ' + o.span[0] + '×' + o.span[1] + ' tiles' : '');
      d.dataset.obj = id;
      d.onclick = () => { pincelObj = id; marcaPaleta(); desenha(); };
      g.appendChild(d);
    }
    p.appendChild(h); p.appendChild(g);
  };
  for (const [titulo, nomes] of GRUPOS) bloco(titulo, nomes);
  const postosObj = new Set(GRUPOS_OBJ.flatMap(([, ids]) => ids));
  for (const [titulo, ids] of GRUPOS_OBJ) blocoObj(titulo, ids);
  /* Objeto que entrar em OBJ e não estiver em GRUPOS_OBJ aparece aqui em vez de
     SUMIR. O lado do tile já tinha esta rede e o do objeto não — e a lista de
     grupos é escrita à mão, então ela vai envelhecer. Objeto invisível na
     paleta é objeto que não existe para quem edita. */
  const sobraObj = Object.keys(OBJ).filter(k => !postosObj.has(k));
  if (sobraObj.length) blocoObj('objeto · sem grupo', sobraObj);
  /* Tile que entrar na tabela e não estiver em GRUPOS aparece aqui em vez de
     sumir da paleta: a lista de grupos é escrita à mão e vai envelhecer. */
  /* O que migra para objeto fica FORA da rede de "sem grupo": senão os quatorze
     voltariam por aqui, que é o mesmo defeito com outro nome. Eles têm entrada
     própria na paleta de objeto, e é lá que se pega uma árvore. */
  const sobra = Object.keys(T).filter(k => !postos.has(k) && !MIGRA[T[k]]);
  if (sobra.length) bloco('sem grupo', sobra);
}

/* -------------------------------------------------------------- o desenho */
function ajusta() {
  /* O tamanho de CSS do canvas é do VISOR; o do BUFFER é de cada modo — a vista
     de jogo cria em pixel de dispositivo (é o `resizeCam` que faz isso, e é o
     que mantém o pixel limpo em tela HiDPI), a planta cria igual. Sem esta
     linha o canvas fica nos 300×150 de fábrica: era o `ajusta` antigo que o
     dimensionava, por atributo, e ele deixou de fazer isso. */
  const v = $('#visor');
  cv.style.width = v.clientWidth + 'px';
  cv.style.height = v.clientHeight + 'px';
  ctx.imageSmoothingEnabled = false;
  desenha();
}
const colunas = () => Math.ceil(cv.clientWidth / px) + 1;
const linhas = () => Math.ceil(cv.clientHeight / px) + 1;

function limitaCam() {
  /* Meia tela de folga dos dois lados: travar a câmera na borda exata impede de
     trabalhar no tile 0 com conforto, e mapa menor que o visor ficaria colado
     no canto — que é o defeito que esta reforma veio consertar. */
  ecamX = trava(ecamX, -cv.clientWidth / px / 2, W - cv.clientWidth / px / 2);
  ecamY = trava(ecamY, -cv.clientHeight / px / 2, H - cv.clientHeight / px / 2);
}

/* O MUNDO PELO RENDER DO JOGO.
   A câmera do jogo é centrada em `P.px/P.py` e o `drawFloor` põe o canto do
   tile em `(x - ecamX) * t + VW/2 - t/2`. Resolvendo para que isso dê exatamente
   `(x - ecamX) * t`, o centro tem de ficar meio tile antes do meio da
   tela — é daí que sai o `- 0.5`. Com isso a matemática do overlay (grade,
   marca de mexido, spawn, pincel) continua sendo a mesma dos dois modos, e o
   mouse continua sendo `(clientX - rect.left) / px`.
   O canvas é criado em pixel de DISPOSITIVO pelo `resizeCam`, então o overlay
   desenha sob uma transform de dpr e segue falando em pixel de CSS. */
function desenhaJogo() {
  CAM.zoom = px / TS;
  resizeCam(cv);
  const t = TS * CAM.scale;
  P.z = z;
  P.px = P.x = ecamX + cv.width / (2 * t) - 0.5;
  P.py = P.y = ecamY + cv.height / (2 * t) - 0.5;
  G.now = G.real = 5e6;          // relógio parado: vento e água quietos enquanto se edita
  drawWorld();
  ctx.setTransform(dpr(), 0, 0, dpr(), 0, 0);
}

/* NO EXTREMO AFASTADO, um `drawImage` no lugar de cem mil `fillRect`.
   A 2,2 px por tile a tela cobre mais de 120 mil tiles e a planta gastava 94 ms
   por quadro só pintando quadradinho — e nesse zoom cada tile é um borrão de
   dois pixels, então a fidelidade por tile não compra nada.
   O motor já monta exatamente esta imagem: o `buildMinimaps` desenha o andar
   inteiro em 1 px por tile, chão e objeto, com as mesmas cores. Reusar é uma
   chamada; reescrever seria uma terceira régua de cor de mapa depois do render
   e da planta. Só precisa ser remontado quando o mapa muda, e quem edita marca. */
let miniSujo = true;
const MINI_ATE = 4;
function desenhaMini() {
  const d = dpr();
  if (miniSujo) { buildMinimaps(); miniSujo = false; }
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#0a0908'; ctx.fillRect(0, 0, cv.clientWidth, cv.clientHeight);
  ctx.drawImage(miniCanvas[z], -ecamX * px, -ecamY * px, W * px, H * px);
}

function desenhaPlanta() {
  const d = dpr();
  if (cv.width !== Math.round(cv.clientWidth * d)) { cv.width = Math.round(cv.clientWidth * d); cv.height = Math.round(cv.clientHeight * d); }
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.imageSmoothingEnabled = false;
  const x0 = Math.floor(ecamX), y0 = Math.floor(ecamY);
  const ox = (ecamX - x0) * px, oy = (ecamY - y0) * px;
  ctx.fillStyle = '#0a0908'; ctx.fillRect(0, 0, cv.clientWidth, cv.clientHeight);
  const t = WORLD.floors[z].t;
  for (let j = 0; j < linhas(); j++) for (let i = 0; i < colunas(); i++) {
    const x = x0 + i, y = y0 + j;
    if (x < 0 || y < 0 || x >= W || y >= H) continue;
    ctx.fillStyle = cssCor(t[y * W + x]);
    ctx.fillRect(Math.round(i * px - ox), Math.round(j * px - oy), Math.ceil(px), Math.ceil(px));
  }
  /* O OBJETO por cima, com a cor do material — sem isto a planta repete o
     defeito que o minimapa teve e some tudo que dá forma ao lugar.
     Varrendo a LISTA e não os tiles: afastado, a tela cobre mais de cem mil
     tiles e o andar tem quatro mil objetos, então perguntar "há objeto aqui?"
     por tile é fazer 25 vezes mais trabalho para achar a mesma coisa. É o mesmo
     raciocínio do `poiAt`, que varre os 39 pontos em vez de perguntar por
     tile. */
  const x1 = x0 + colunas(), y1 = y0 + linhas();
  for (const o of WORLD.floors[z].objs) {
    const dd = OBJ[o.o];
    if (!dd || dd.c === undefined) continue;
    const sp = dd.span || [1, 1];
    if (o.x + sp[0] < x0 || o.y + sp[1] < y0 || o.x > x1 || o.y > y1) continue;
    ctx.fillStyle = '#' + dd.c.toString(16).padStart(6, '0');
    for (let j = 0; j < sp[1]; j++) for (let i = 0; i < sp[0]; i++)
      ctx.fillRect(Math.round((o.x + i - ecamX) * px), Math.round((o.y + j - ecamY) * px),
        Math.ceil(px), Math.ceil(px));
  }
}

function desenha() {
  if (!base) return;
  limitaCam();
  const x0 = Math.floor(ecamX), y0 = Math.floor(ecamY);
  const ox = (ecamX - x0) * px, oy = (ecamY - y0) * px;
  if (vistaAgora() === 'jogo') desenhaJogo();
  else if (px < MINI_ATE) desenhaMini();
  else desenhaPlanta();
  const telaX = x => Math.round((x - ecamX) * px), telaY = y => Math.round((y - ecamY) * px);

  /* Grade só quando o tile é grande o bastante para ela não virar ruído. Sem
     grade não se conta tile, e contar tile é metade do trabalho de editar. */
  if (gradeMapa() && px >= 7) {
    ctx.strokeStyle = vistaAgora() === 'jogo' ? 'rgba(255,255,255,.13)' : 'rgba(0,0,0,.24)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i <= colunas(); i++) { const sx = Math.round(i * px - ox) + .5; ctx.moveTo(sx, 0); ctx.lineTo(sx, cv.clientHeight); }
    for (let j = 0; j <= linhas(); j++) { const sy = Math.round(j * px - oy) + .5; ctx.moveTo(0, sy); ctx.lineTo(cv.clientWidth, sy); }
    ctx.stroke();
  }

  /* O que VOCÊ mexeu fica marcado enquanto não grava. Sem isso não há como
     saber o que é seu e o que é meu, e a primeira coisa que se perde num editor
     é a noção do que já foi tocado.
     Desligável no X porque, numa região recém-pintada, um contorno por tile É
     uma grade — e ela cai exatamente em cima do que se acabou de pôr, que é
     onde se quer julgar o tile. O contador de "por gravar" fica, então
     desligar a marca não esconde que há coisa pendente. */
  if (gradeEdicao()) {
    ctx.strokeStyle = 'rgba(216,194,122,.9)'; ctx.lineWidth = px >= 4 ? 1 : 2;
    for (const k of [...mexidos.keys(), ...mexidosObj.keys()]) {
      const [kz, ki] = k.split(':').map(Number);
      if (kz !== z) continue;
      const x = ki % W, y = (ki / W) | 0;
      if (x < x0 - 1 || y < y0 - 1 || x > x0 + colunas() || y > y0 + linhas()) continue;
      ctx.strokeRect(telaX(x) + .5, telaY(y) + .5, Math.max(1, px - 1), Math.max(1, px - 1));
    }
  }

  // spawn e hunt: não se editam aqui ainda, mas apagar um tile com bicho em
  // cima sem ver o bicho seria pior
  ctx.fillStyle = '#ffd25a';
  const r = Math.max(2, px * .34);
  for (const s of WORLD.spawns) if (s.z === z) {
    const sx = telaX(s.x), sy = telaY(s.y);
    if (sx < -px || sy < -px || sx > cv.clientWidth || sy > cv.clientHeight) continue;
    ctx.fillRect(sx + px / 2 - r / 2, sy + px / 2 - r / 2, r, r);
  }
  ctx.strokeStyle = 'rgba(255,90,60,.85)'; ctx.lineWidth = 1.5;
  for (const h of WORLD.hunts) if (h.z === z) {
    ctx.beginPath(); ctx.arc(telaX(h.x) + px / 2, telaY(h.y) + px / 2, h.r * px, 0, 7); ctx.stroke();
  }

  /* O pincel embaixo do cursor. Com raio 2, ou com objeto de 2×3, é impossível
     acertar onde a coisa cai sem ver a marca ANTES de clicar. */
  if (hover && ferramenta !== 'conta-gotas') {
    const sp = pincelObj !== null ? (pincelObj && OBJ[pincelObj].span) : TILE[pincel].span;
    const [hx, hy] = hover;
    const risca = c => { ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.stroke(c);
                         ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke(c); };
    if (ferramenta === 'retangulo' && arrastando && arrastando.ret) {
      const ax = Math.min(arrastando.x, hx), ay = Math.min(arrastando.y, hy);
      const c = new Path2D();
      c.rect(telaX(ax) + .5, telaY(ay) + .5,
             (Math.abs(hx - arrastando.x) + 1) * px - 1, (Math.abs(hy - arrastando.y) + 1) * px - 1);
      risca(c);
    } else if (sp && !raio) {                  // objeto grande sozinho: o rastro dele
      const c = new Path2D();
      c.rect(telaX(hx) + .5, telaY(hy) + .5, sp[0] * px - 1, sp[1] * px - 1);
      risca(c);
    } else {
      /* Círculo e mancha não têm contorno retangular, então a marca deixou de ser
         um retângulo e passou a ser a UNIÃO das células — desenhada só nas arestas
         que fazem divisa com quem está de fora, senão 169 quadradinhos viram malha.
         Sem densidade aqui de propósito: ela sorteia a cada clique, e mostrar um
         sorteio que não se repete seria pior que não mostrar nada. */
      const dentro = new Set();
      for (const [x, y] of celulas(hx, hy, false))
        if (sp) { for (let j = 0; j < sp[1]; j++) for (let i = 0; i < sp[0]; i++) dentro.add((x + i) + ',' + (y + j)); }
        else dentro.add(x + ',' + y);
      const c = new Path2D();
      ctx.fillStyle = 'rgba(255,255,255,.14)';
      for (const p of dentro) {
        const [x, y] = p.split(',').map(Number);
        const sx = telaX(x), sy = telaY(y);
        ctx.fillRect(sx, sy, px, px);
        if (!dentro.has(x + ',' + (y - 1))) { c.moveTo(sx, sy + .5); c.lineTo(sx + px, sy + .5); }
        if (!dentro.has(x + ',' + (y + 1))) { c.moveTo(sx, sy + px - .5); c.lineTo(sx + px, sy + px - .5); }
        if (!dentro.has((x - 1) + ',' + y)) { c.moveTo(sx + .5, sy); c.lineTo(sx + .5, sy + px); }
        if (!dentro.has((x + 1) + ',' + y)) { c.moveTo(sx + px - .5, sy); c.lineTo(sx + px - .5, sy + px); }
      }
      risca(c);
    }
  }
  estado();
}

function estado() {
  const n = mexidos.size + mexidosObj.size;
  $('#estado').innerHTML = n
    ? '<span class="aviso">● ' + n + ' tile' + (n > 1 ? 's' : '') + ' por gravar</span>'
    : '<span class="ok">● nada pendente</span>';
  $('#lupa').textContent = px.toFixed(1).replace('.0', '') + '× · ' +
    (vista === 'jogo'
       ? (px >= VISTA_MIN ? 'jogo' : 'planta (jogo volta ao aproximar)')
       : 'planta') + ' (V) · luz ' + (luz === 'andar' ? 'do andar' : 'neutra') + ' (L)' +
    ' · grade ' + GRADES[grade] + (gradeMapa() && px < 7 ? ', a do mapa oculta no zoom' : '') + ' (X)';
}

/* ------------------------------------------------------------ a edição */
function desfazObj(k, antes) {
  const [kz, ki] = k.split(':').map(Number);
  const x = ki % W, y = (ki / W) | 0, f = WORLD.floors[kz];
  f.objs = f.objs.filter(o => !(o.x === x && o.y === y));
  for (const d of antes) f.objs.push({ x, y, o: d });
  f.oi = null;
  const mesmo = baseObj[kz][ki] || [];
  if (mesmo.length === antes.length && mesmo.every((v, n) => v === antes[n])) mexidosObj.delete(k);
  else mexidosObj.set(k, antes);
}

function poe(x, y, t, lote) {
  if (x < 0 || y < 0 || x >= W || y >= H) return;
  const i = y * W + x, k = chave(z, i), atual = WORLD.floors[z].t[i];
  if (atual === t) return;
  lote.push([k, atual]);
  WORLD.floors[z].t[i] = t;
  /* O patch é DIFF contra a base, não histórico: pintar grama sobre grama que
     já era grama tem de sumir do patch, senão ele cresce para sempre com
     correções que não corrigem nada. */
  if (base[z][i] === t) mexidos.delete(k); else mexidos.set(k, t);
  miniSujo = true;
}

/* A lista de objetos ANCORADOS neste tile, ordenada — a ordem canônica é o que
   permite comparar com a base sem falso positivo por ordem diferente. */
const idsEm = (x, y, zz) => WORLD.floors[zz].objs
  .filter(o => o.x === x && o.y === y).map(o => o.o).sort();

function poeObj(x, y, id, lote) {
  if (x < 0 || y < 0 || x >= W || y >= H) return;
  const f = WORLD.floors[z], i = y * W + x, k = chave(z, i);
  const antes = idsEm(x, y, z);
  let depois;
  if (id === '') depois = [];
  else if (antes.includes(id)) return;         // idempotente: arrastar não empilha 50 barris
  else depois = [...antes, id].sort();
  lote.push([k, antes, 'obj']);
  f.objs = f.objs.filter(o => !(o.x === x && o.y === y));
  for (const d of depois) f.objs.push({ x, y, o: d });
  f.oi = null;
  const mesmo = baseObj[z][i] || [];
  if (mesmo.length === depois.length && mesmo.every((v, n) => v === depois[n])) mexidosObj.delete(k);
  else mexidosObj.set(k, depois);
  miniSujo = true;
}

function pintar(x, y, lote) {
  const cel = celulas(x, y, true);
  if (pincelObj !== null) {
    /* Objeto de mais de um tile pinta só a ÂNCORA: o rastro é do índice, não do
       mapa. É a diferença que a separação de camadas comprou — antes o pincel
       tinha de pintar os 6 tiles do moinho e um deles faltando dava âncora sem
       rastro, que não desenha nada e não dá erro. */
    for (const [cx, cy] of cel) poeObj(cx, cy, pincelObj, lote);
    return;
  }
  const sp = TILE[pincel].span;
  if (sp) {                                    // objeto grande: cada âncora pinta o rastro inteiro
    for (const [cx, cy] of cel)
      for (let j = 0; j < sp[1]; j++) for (let i = 0; i < sp[0]; i++) poe(cx + i, cy + j, pincel, lote);
    return;
  }
  for (const [cx, cy] of cel) poe(cx, cy, pincel, lote);
}

/* Balde com pilha explícita e não recursão: 192×192 é 36 mil tiles, e o
   navegador estoura a pilha de chamadas bem antes disso num continente.
   E com FREIO: o primeiro teste foi um clique no oceano, que virou 19.646 tiles
   de uma vez — e um patch de 19 mil linhas no git. Um balde num campo cercado
   pinta dezenas; um balde numa região aberta pinta metade do mapa, e a
   diferença não se enxerga antes de clicar. Então ele MEDE e pergunta. */
const BALDE_AVISA = 400;
function balde(x, y, lote) {
  /* O balde é de TERRENO. Com um objeto escolhido na paleta ele pintava o
     terreno do último pincel de chão — ação silenciosa e errada, e das piores,
     porque balde pinta centenas de tiles de uma vez. Inundar de objeto também
     não é o que se quer (mil árvores num clique), então ele avisa e para. */
  if (pincelObj !== null) {
    alert('O balde é de terreno, e o que está escolhido é um objeto.\n\n' +
          'Escolha um tile de chão na paleta, ou use o pincel com mancha e ' +
          'densidade para espalhar objeto.');
    return;
  }
  const alvo = WORLD.floors[z].t[y * W + x];
  if (alvo === pincel) return;
  const p = [[x, y]], visto = new Set(), area = [];
  while (p.length) {
    const [cx, cy] = p.pop(), i = cy * W + cx;
    if (cx < 0 || cy < 0 || cx >= W || cy >= H || visto.has(i)) continue;
    if (WORLD.floors[z].t[i] !== alvo) continue;
    visto.add(i); area.push([cx, cy]);
    p.push([cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]);
  }
  if (area.length > BALDE_AVISA && !confirm(
      'O balde vai pintar ' + area.length + ' tiles de ' + nomeTile(alvo).toLowerCase() +
      ' em ' + nomeTile(pincel).toLowerCase() + '.\n\nIsso é ' +
      (area.length / (W * H) * 100).toFixed(1) + '% do andar. Continuar?')) return;
  for (const [cx, cy] of area) poe(cx, cy, pincel, lote);
}

const tileSob = e => {
  const r = cv.getBoundingClientRect();
  return [Math.floor((e.clientX - r.left) / px + ecamX), Math.floor((e.clientY - r.top) / px + ecamY)];
};
const dentro = ([x, y]) => x >= 0 && y >= 0 && x < W && y < H;

cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('mousedown', e => {
  e.preventDefault();
  /* Arrastar com o botão DIREITO ou do MEIO move o mapa. Sem isso, no zoom alto
     só dava para chegar nos tiles que calhassem de estar na tela ao carregar. */
  if (e.button === 1 || e.button === 2) {
    panning = { x: e.clientX, y: e.clientY, cx: ecamX, cy: ecamY };
    cv.classList.add('pan');
    return;
  }
  if (e.button !== 0) return;
  const t = tileSob(e);
  if (!dentro(t)) return;
  if (ferramenta === 'conta-gotas') {
    /* Pega o OBJETO se houver um, e o chão se não houver — é o que a mão espera
       ao apontar para um barril. E precisa zerar o outro pincel nos dois casos:
       pegando o chão com um objeto selecionado, o `pincelObj` continuava valendo
       e o pincel seguia pintando o objeto, então o conta-gotas parecia não
       fazer nada. */
    const aqui = idsEm(t[0], t[1], z);
    if (aqui.length) { pincelObj = aqui[aqui.length - 1]; }
    else { pincel = WORLD.floors[z].t[t[1] * W + t[0]]; pincelObj = null; }
    marcaPaleta(); desenha(); return;
  }
  const lote = [];
  if (ferramenta === 'balde') { balde(t[0], t[1], lote); if (lote.length) pilha.push(lote); desenha(); return; }
  
  if (ferramenta === 'retangulo') { arrastando = { x: t[0], y: t[1], lote, ret: 1 }; return; }
  arrastando = { lote };
  pintar(t[0], t[1], lote);
  desenha();
});

cv.addEventListener('mousemove', e => {
  if (panning) {
    ecamX = panning.cx - (e.clientX - panning.x) / px;
    ecamY = panning.cy - (e.clientY - panning.y) / px;
    desenha();
    return;
  }
  const t = tileSob(e);
  hover = dentro(t) ? t : null;
  if (hover) {
    const [x, y] = hover, tt = WORLD.floors[z].t[y * W + x];
    const s = WORLD.spawns.find(sp => sp.z === z && sp.x === x && sp.y === y);
    const h = WORLD.hunts.find(hh => hh.z === z && Math.hypot(hh.x - x, hh.y - y) <= hh.r);
    $('#sob').textContent = String(x).padStart(3) + ',' + String(y).padStart(3) + '  ' +
      nomeTile(tt).toLowerCase() + (TILE[tt].walk ? '' : ' (barra)') +
      (base[z][y * W + x] !== tt ? '  ← mexido' : '') +
      (s ? '  · spawn ' + (MONSTERS[s.m] ? MONSTERS[s.m].n : s.m) : '') +
      (h ? '  · hunt ' + h.n : '');
  } else $('#sob').innerHTML = '&nbsp;';
  if (arrastando && !arrastando.ret && hover) pintar(hover[0], hover[1], arrastando.lote);
  desenha();
});

addEventListener('mouseup', e => {
  if (panning) { panning = null; cv.classList.remove('pan'); return; }
  if (!arrastando) return;
  if (arrastando.ret) {
    const t = tileSob(e);
    if (dentro(t)) {
      const x0 = Math.min(arrastando.x, t[0]), x1 = Math.max(arrastando.x, t[0]);
      const y0 = Math.min(arrastando.y, t[1]), y1 = Math.max(arrastando.y, t[1]);
      /* O retângulo respeita o pincel ESCOLHIDO. Pintava sempre terreno, então
         com um objeto na paleta ele estampava o último tile de chão usado — sem
         erro e sem aviso, que é o pior jeito de errar uma área inteira. */
      for (let j = y0; j <= y1; j++) for (let i = x0; i <= x1; i++)
        if (pincelObj !== null) poeObj(i, j, pincelObj, arrastando.lote);
        else poe(i, j, pincel, arrastando.lote);
    }
  }
  if (arrastando.lote.length) pilha.push(arrastando.lote);
  arrastando = null;
  desenha();
});
cv.addEventListener('mouseleave', () => { hover = null; $('#sob').innerHTML = '&nbsp;'; desenha(); });

/* ZOOM PELA RODA, ANCORADO NO CURSOR: o tile embaixo do ponteiro continua
   embaixo dele depois de ampliar. Era um menu com cinco valores fixos, e
   escolher zoom num menu obriga a tirar a mão do mapa e a perder o lugar —
   reescalar a partir do canto é o que fazia "tudo ficar espremido no canto". */
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const alvoX = ecamX + mx / px, alvoY = ecamY + my / px;
  /* SEM TETO para aproximar. O limite de 28 era arbitrário e atrapalhava o que
     o editor passou a servir: com a vista de jogo, chegar perto é como se olha
     um tile de 32 px de verdade — a 64 ou 128 px por tile dá para conferir a
     junta entre dois terrenos e a silhueta de um objeto, que é onde a arte se
     decide. O piso de 1 fica: abaixo disso o tile some e não há o que editar,
     e para navegar longe existe o "ver tudo". */
  const novo = Math.max(1, px * (e.deltaY > 0 ? 1 / 1.2 : 1.2));
  if (novo === px) return;
  px = novo;
  ecamX = alvoX - mx / px; ecamY = alvoY - my / px;
  desenha();
}, { passive: false });

function verTudo() {
  /* `clientWidth` e não `width`: o primeiro é pixel de CSS e o segundo é pixel
     de BUFFER, e os dois só coincidem em tela sem HiDPI. Com `devicePixelRatio`
     2 — que é a tela do dono — o zoom saía o dobro do que cabe e o "ver tudo"
     mostrava 46% do mapa, medido. Todo o resto do editor (`limitaCam`, o mouse,
     o overlay) já trabalha em pixel de CSS; era esta função que destoava. */
  const w = cv.clientWidth, h = cv.clientHeight;
  px = Math.max(0.05, Math.min(w / W, h / H));
  ecamX = W / 2 - w / px / 2;
  ecamY = H / 2 - h / px / 2;
  desenha();
}

function desfazer() {
  const lote = pilha.pop();
  if (!lote) return;
  for (let i = lote.length - 1; i >= 0; i--) {
    const [k, antes, tipo] = lote[i];
    if (tipo === 'obj') { desfazObj(k, antes); continue; }
    const [kz, ki] = k.split(':').map(Number);
    WORLD.floors[kz].t[ki] = antes;
    if (base[kz][ki] === antes) mexidos.delete(k); else mexidos.set(k, antes);
  }
  desenha();
}

/* ------------------------------------------------------- carregar e gravar */
/* ABERTO POR file:// NÃO FUNCIONA, e a mensagem do navegador para isso é
   "Failed to fetch" — que não diz nada a quem só deu duplo clique no arquivo.
   O editor precisa de servidor por dois motivos independentes: `fetch` de
   arquivo local é bloqueado pelo navegador, e gravar depende do POST que só o
   tools/serve.py atende. Então a página detecta e ENSINA. */
function semServidor() {
  /* ABERTO POR DUPLO CLIQUE NO .HTML. Isto nao tem conserto do lado da pagina:
     o navegador nao deixa arquivo local ler outro arquivo local nem subir
     servidor, e o editor precisa das duas coisas -- ler o mapa e gravar o
     patch. O que a pagina PODE fazer e parar de mostrar o erro cru do
     navegador ("Failed to fetch") e dizer qual arquivo clicar. */
  document.body.innerHTML =
    '<div style="padding:30px;max-width:70ch;line-height:1.75">' +
    '<h1 style="color:#d8c27a;font:600 19px/1.3 ui-serif,Georgia,serif;margin:0 0 10px">' +
    'Clique no Editor.bat, não neste arquivo</h1>' +
    '<p>Esta página está aberta como <code>' + location.protocol + '</code>. O navegador não ' +
    'deixa um arquivo local ler outro nem subir servidor — e o editor precisa das duas coisas: ' +
    'ler o mapa e gravar o seu patch. Não há como a página resolver isso sozinha.</p>' +
    '<p style="color:#d8c27a"><b>Na pasta do projeto, dê duplo clique em ' +
    '<code>Editor.bat</code>.</b></p>' +
    '<p>Ele abre o jogo e o editor lado a lado. Você edita, grava com ' +
    '<code>Ctrl+S</code>, e o jogo ao lado se atualiza sozinho — sem terminal, sem servidor ' +
    'para subir na mão. Dentro do jogo, <code>F9</code> também abre o editor.</p>' +
    '<p style="color:#8a7f6d;font-size:12px;margin-top:22px">Se preferir o navegador: ' +
    '<code>python tools/serve.py 8765</code> na raiz do projeto e abra ' +
    '<code>localhost:8765/tools/editor.html</code>.</p></div>';
}

function carregar(nome, manterVista) {
  if (location.protocol === 'file:') { semServidor(); return Promise.resolve(); }
  const url = '../maps/' + nome + '.json';
  return fetch(url)
    .then(r => { if (!r.ok) throw new Error('o servidor respondeu ' + r.status); return r.json(); })
    .then(o => {
      const vista = { z, px, ecamX, ecamY };
      mapaAplica(o);
      /* A BASE é o mapa recém-carregado, e o arquivo já vem COM o patch
         aplicado (o script grava depois de aplicá-lo). Então o diff daqui é
         contra o estado atual, e gravar duas vezes sem mexer em nada dá patch
         vazio — que é o certo: o patch acumula no arquivo, não na sessão. */
      miniSujo = true;
      base = WORLD.floors.map(f => f.t.slice());
      /* A base da segunda camada, no mesmo formato do diff: idx -> [ids]
         ordenado. Ordenado porque a comparação é elemento a elemento, e duas
         listas com os mesmos objetos em ordem diferente marcariam o tile como
         mexido para sempre — patch que cresce sozinho é o defeito que o freio
         de 2.000 tiles existe para pegar depois de já ter acontecido. */
      baseObj = WORLD.floors.map(f => {
        const m = {};
        for (const o of f.objs) { const i = o.y * W + o.x; (m[i] = m[i] || []).push(o.o); }
        for (const k in m) m[k].sort();
        return m;
      });
      mexidos = new Map(); mexidosObj = new Map(); pilha = [];
      ajusta();
      if (manterVista && vista.z < FLOORS) {
        z = vista.z; px = vista.px; ecamX = vista.ecamX; ecamY = vista.ecamY;
        andares(); desenha();
      } else {
        /* Abre na SUPERFÍCIE e não no andar 0: em Varrokgaard o andar 0 é a
           ponte sobre o muro, doze tiles num mar de vazio, e o editor abria
           numa tela preta. Quem edita edita a terra. */
        z = SURF;
        andares(); verTudo();
      }
      carregado = nome;
      document.title = 'Editor — ' + nome;
      /* O MAPA ESTÁ ATRASADO EM RELAÇÃO AO PATCH? Acontece quando o patch é
         gravado e ninguém recompõe — o caso clássico é um servidor estranho na
         porta, que grava e não sabe recompor. O editor conta quantos tiles do
         patch não estão no mapa que acabou de carregar.
         E oferece o BOTÃO em vez de mandar rodar `node` num terminal: se o
         aviso existe para dizer que uma coisa precisa ser feita, ele tem de
         saber fazê-la. Só manda o comando quando o servidor não sabe recompor,
         que é a única situação em que o botão não teria como funcionar. */
      fetch('../maps/' + nome + '.patch.json').then(r => r.ok ? r.json() : null)
        .then(pt => {
          if (!pt) return;
          let fora = 0, total = 0;
          for (const kz in pt.tiles || {}) {
            const iz = +kz;
            if (iz >= FLOORS) { fora += pt.tiles[kz].length; total += pt.tiles[kz].length; continue; }
            for (const [x, y, t] of pt.tiles[kz]) {
              total++;
              if (x >= W || y >= H) continue;
              /* O patch fala o VOCABULÁRIO DE AUTOR (`T.TREE`, `T.BARREL`), e o
                 mapa carregado já está partido em chão + objeto: comparar o tile
                 do patch com o terreno acusaria atraso em toda árvore e todo
                 móvel corrigido à mão. Foi o que aconteceu — 918 de 918, alarme
                 falso completo, no primeiro carregamento depois da separação.
                 Para esses, a pergunta certa é se o OBJETO correspondente está
                 lá. Um alarme que grita sempre é o mesmo que alarme nenhum. */
              const mg = MIGRA[t];
              if (mg) { if (!objsAt(x, y, iz).some(o => o.o === mg.o)) fora++; }
              else if (WORLD.floors[iz].t[y * W + x] !== t) fora++;
            }
          }
          /* A CAMADA DE OBJETO também conta. Enquanto o `objs` do patch era
             descartado na gravação isto não tinha o que medir; agora que ele
             chega ao disco, um mapa não recomposto tem de acusar o objeto que
             falta, e não só o tile. */
          for (const kz in pt.objs || {}) {
            const iz = +kz;
            if (iz >= FLOORS) { fora += pt.objs[kz].length; total += pt.objs[kz].length; continue; }
            for (const [x, y, ids] of pt.objs[kz]) {
              total++;
              if (x >= W || y >= H) continue;
              const aqui = objsAt(x, y, iz).map(o => o.o).sort();
              const quer = (ids || []).slice().sort();
              if (aqui.length !== quer.length || aqui.some((v, i) => v !== quer[i])) fora++;
            }
          }
          if (!fora) return;
          const log = $('#log');
          log.className = 'ruim';
          log.textContent = [
            'O MAPA ESTÁ ATRASADO EM RELAÇÃO AO SEU PATCH.',
            '',
            fora + ' de ' + total + ' tiles do patch não estão no mapa carregado.',
            'Nada se perdeu — o patch está no disco. Falta aplicá-lo.'
          ].join('\n');
          const b = document.createElement('button');
          b.textContent = 'recompor agora (' + fora + ' tiles)';
          b.style.cssText = 'display:block;margin-top:9px';
          b.onclick = () => {
            b.disabled = true; b.textContent = 'recompondo…';
            fetch('/recompor/' + nome, { method: 'POST' })
              .then(r => r.ok ? r.json() : Promise.reject(new Error(r.status)))
              .then(r => {
                log.textContent = r.log || '';
                log.className = (r.recompos && !r.aviso) ? '' : 'ruim';
                if (r.recompos) {
                  if (typeof BroadcastChannel === 'function')
                    new BroadcastChannel('thaira-mapa').postMessage({ mapa: nome });
                  carregar(nome, true);
                }
              })
              .catch(() => {
                log.textContent = [
                  'ESTE SERVIDOR NÃO SABE RECOMPOR.',
                  '',
                  'Você está numa porta servida por outra coisa — quase sempre um',
                  '"python tools/serve.py" antigo deixado aberto. Feche-o e abra o',
                  'Editor.bat, que sobe o servidor certo.',
                  '',
                  'Para aplicar agora sem isso: node tools/mapas/' + nome + '.js'
                ].join('\n');
              });
          };
          log.appendChild(b);
        }).catch(() => {});
    })
    .catch(e => alert('mapa "' + nome + '" não carregou.\n\n' + e.message +
      '\n\nTentei: ' + new URL(url, location.href).href +
      '\n\nSe o caminho acima não aponta para a pasta maps/ do projeto, o servidor ' +
      'não está servindo a raiz do repositório — rode "python tools/serve.py 8765" de dentro dela.'));
}

function andares() {
  const d = $('#andares'); d.innerHTML = '';
  for (let i = 0; i < FLOORS; i++) {
    const b = document.createElement('button');
    b.innerHTML = (FLOOR_NAMES[i] || ('andar ' + i)) + '<b>F' + (i + 1) + '</b>';
    b.className = i === z ? 'on' : '';
    b.onclick = () => { z = i; andares(); desenha(); };
    d.appendChild(b);
  }
}

function gravar() {
  const nome = carregado;
  if (!nome) { alert('não há mapa carregado para gravar.'); return; }
  if ($('#nome').value.trim() !== nome && !confirm(
      'A caixa diz "' + $('#nome').value.trim() + '" mas o que está na tela é "' + nome + '".\n\n' +
      'Vou gravar em ' + nome + ', que é o que você editou. Para abrir o outro, use "carregar".'))
    return;
  /* O patch ACUMULA no arquivo, não na sessão. Somar é o certo — mas somar
     CALADO não é, e isso custou uma medição: um balde de teste no oceano deixou
     19.646 tiles no arquivo, e a gravação seguinte de 31 tiles reportou 31
     enquanto escrevia 19.686. */
  let antes = 0;
  /* LER O PATCH DE DISCO É PRÉ-REQUISITO DA GRAVAÇÃO, e falhar aqui em silêncio
     apagaria todo o acumulado: o patch novo é o antigo MAIS esta sessão, então
     um `catch` que devolve `{}` grava só o que você fez hoje e joga fora o resto.
     Só o 404 é condição normal — significa "ainda não há patch". Qualquer outra
     coisa ABORTA, e o que estava na tela continua na tela. */
  fetch('../maps/' + nome + '.patch.json')
    .then(r => {
      if (r.ok) return r.json();
      if (r.status === 404) return { tiles: {}, objs: {} };
      throw new Error('o patch existente respondeu ' + r.status);
    })
    .then(velho => {
      antes = Object.values(velho.tiles || {}).reduce((a, v) => a + v.length, 0);
      const saida = { nome, tiles: velho.tiles || {}, objs: velho.objs || {} };
      for (const [k, t] of mexidos) {
        const [kz, ki] = k.split(':').map(Number);
        (saida.tiles[kz] = saida.tiles[kz] || []).push([ki % W, (ki / W) | 0, t]);
      }
      for (const [k, ids] of mexidosObj) {
        const [kz, ki] = k.split(':').map(Number);
        (saida.objs[kz] = saida.objs[kz] || []).push([ki % W, (ki / W) | 0, ids]);
      }
      // mesma regra da camada de terreno: um tile mexido duas vezes vale a última
      for (const kz in saida.objs) {
        const ultimo = new Map();
        for (const [x, y, ids] of saida.objs[kz]) ultimo.set(y * W + x, ids);
        saida.objs[kz] = [...ultimo].map(([i, ids]) => [i % W, (i / W) | 0, ids]);
      }
      // um tile mexido duas vezes vale a última: o patch é estado, não histórico
      for (const kz in saida.tiles) {
        const ultimo = new Map();
        for (const [x, y, t] of saida.tiles[kz]) ultimo.set(y * W + x, t);
        saida.tiles[kz] = [...ultimo].map(([i, t]) => [i % W, (i / W) | 0, t]);
      }
      const total = Object.values(saida.tiles).reduce((a, v) => a + v.length, 0) +
        Object.values(saida.objs).reduce((a, v) => a + v.length, 0);
      if (total > 2000 && !confirm(
          'O patch vai ficar com ' + total + ' tiles (' + antes +
          ' já estavam no arquivo, ' + mexidos.size + ' são desta sessão).' +
          '\n\nPatch desse tamanho costuma ser balde dado sem querer numa região ' +
          'aberta. Gravar mesmo assim?')) return null;
      $('#log').className = ''; $('#log').textContent = 'gravando e recompondo…';
      return fetch('/patch/' + nome, { method: 'POST', body: JSON.stringify(saida) });
    })
    .then(r => r && r.json())
    .then(r => {
      if (!r) { $('#log').textContent = ''; return; }
      const novos = mexidos.size + mexidosObj.size;
      mexidos = new Map(); mexidosObj = new Map(); pilha = [];
      const log = $('#log');
      /* SERVIDOR SEM RECOMPOSIÇÃO. O `serve.py` só ganhou o `recompoe` depois
         que o editor existia, e um servidor que já estava rodando continua com
         o código velho: ele GRAVA o patch e não recompõe, então o mapa do jogo
         fica parado no que era antes e parece que a edição sumiu. Foi o que
         aconteceu de verdade — 727 tiles no patch e o mapa com 262.
         O patch nunca esteve em risco, mas o susto sim. Agora isso grita. */
      if (r.recompos === undefined) {
        log.className = 'ruim';
        log.textContent =
          'O PATCH FOI GRAVADO (' + r.tiles + ' tiles), MAS O MAPA NÃO FOI RECOMPOSTO.\n\n' +
          'Este servidor está rodando uma versão do tools/serve.py anterior à\n' +
          'recomposição automática. Nada se perdeu — o patch está no disco.\n\n' +
          'Pare o servidor e suba de novo:\n' +
          '    python tools/serve.py 8765\n\n' +
          'Depois recarregue esta página. Para aplicar agora sem reiniciar:\n' +
          '    node tools/mapas/' + nome + '.js';
        $('#estado').innerHTML = '<span class="aviso">● gravado, mas NÃO recomposto</span>';
        desenha();
        return;
      }
      log.textContent = r.log || '';
      log.className = (r.recompos && !r.aviso) ? '' : 'ruim';
      $('#estado').innerHTML = '<span class="ok">● gravado: ' + r.tiles + ' no patch (' +
        novos + ' desta sessão, ' + antes + ' de antes)</span>';
      /* RECARREGA SEMPRE, mantendo a vista — inclusive quando a conferência
         reprova. A primeira versão não recarregava nesse caso, achando que
         "mapa duvidoso não vira base sem olhar"; está errado, porque o mapa em
         disco JÁ é o que o jogo carrega, e o editor mostrando outra coisa é a
         única situação de fato perigosa. O aviso é o log em vermelho, não
         esconder o resultado.
         A vista é preservada porque jogar a câmera para o mapa inteiro a cada
         gravação faria perder o ponto em que se está trabalhando. */
      /* AVISA O JOGO. O `node` da composição já rodou no servidor e o
         maps/<nome>.json já é o novo — mas quem estiver com o jogo aberto tem a
         versão antiga em memória, e era isso o "gravei e não aparece nada no
         jogo". `BroadcastChannel` é nativo, alcança as outras abas da mesma
         origem, e não faz nada se não houver ninguém ouvindo. */
      if (typeof BroadcastChannel === 'function')
        new BroadcastChannel('thaira-mapa').postMessage({ mapa: nome });
      return carregar(nome, true);
    })
    .catch(e => alert('não gravou: ' + e.message +
      '\n\nO POST só existe no tools/serve.py. Se você abriu por file:// ou por outro ' +
      'servidor, não vai gravar.'));
}

/* ------------------------------------------------------------- ligações */
$('#carregar').onclick = () => carregar($('#nome').value.trim());
/* Enter na caixa CARREGA. Sem isto o campo aceitava o nome, o dono apertava
   Enter e não acontecia nada — e o guarda de INPUT do keydown engole a tecla,
   então tem de ser tratada aqui. */
$('#nome').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); carregar($('#nome').value.trim()); e.target.blur(); }
});
$('#desfazer').onclick = desfazer;
$('#gravar').onclick = gravar;
/* O botão DIZ em que estado está, em vez de só acender: com três estados,
   aceso/apagado não distingue "só a de edição" de "nenhuma". */
function marcaGrade() {
  const b = $('#btGrade');
  b.classList.toggle('on', grade === 0);
  b.innerHTML = 'grade: ' + GRADES[grade] + '<b>X</b>';
}
const ciclaGrade = () => { grade = (grade + 1) % GRADES.length; marcaGrade(); desenha(); };
$('#btGrade').onclick = ciclaGrade;
marcaGrade();
$('#verTudo').onclick = verTudo;
$('#limpar').onclick = () => {
  /* As DUAS camadas. Descartava só o terreno: as edições de objeto ficavam no
     mapa E na lista de pendentes, então a gravação seguinte as escrevia mesmo
     depois de o dono ter mandado descartar. E com só objetos mexidos o botão
     não fazia nada, porque a guarda olhava `mexidos.size`. */
  const n = mexidos.size + mexidosObj.size;
  if (!n || !confirm('Descartar ' + n + ' tile(s) mexido(s) nesta sessão?')) return;
  for (const [k] of mexidos) {
    const [kz, ki] = k.split(':').map(Number);
    WORLD.floors[kz].t[ki] = base[kz][ki];
  }
  for (const [k] of mexidosObj) {
    const [kz, ki] = k.split(':').map(Number);
    desfazObj(k, (baseObj[kz][ki] || []).slice());
  }
  mexidos = new Map(); mexidosObj = new Map(); pilha = [];
  miniSujo = true; desenha();
};
const marca = (sel, b) => document.querySelectorAll(sel).forEach(o => o.classList.toggle('on', o === b));
document.querySelectorAll('.fer').forEach(b => b.onclick = () => { ferramenta = b.dataset.f; marca('.fer', b); desenha(); });
document.querySelectorAll('.tam').forEach(b => b.onclick = () => { raio = +b.dataset.r; marca('.tam', b); desenha(); });
document.querySelectorAll('.fma').forEach(b => b.onclick = () => { forma = b.dataset.m; marca('.fma', b); desenha(); });
$('#dens').oninput = e => { dens = +e.target.value; $('#densN').textContent = dens + '%'; };
/* Devolve o foco ao mapa depois de arrastar: com o range focado, o guarda de
   INPUT do keydown engoliria B, G, R e todo o resto dos atalhos. */
$('#dens').onpointerup = e => e.target.blur();

/* Atalho de uma tecla para ferramenta e tamanho: com os dois a um toque, a mão
   não sai do mapa para ir à barra e voltar — que é metade do "ruim de mexer".
   Andar vai em F1..F9 para não brigar com 1..6, que são o tamanho do pincel. */
const TECLA_FER = { b: 'pincel', g: 'balde', r: 'retangulo', i: 'conta-gotas' };
const TECLA_FMA = { q: 'quadrado', c: 'circulo', m: 'mancha' };
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (e.ctrlKey && k === 'z') { e.preventDefault(); return desfazer(); }
  if (e.ctrlKey && k === 's') { e.preventDefault(); return gravar(); }
  if (e.ctrlKey) return;
  if (/^f\d+$/.test(k)) {
    const i = +k.slice(1) - 1;
    if (i >= 0 && i < FLOORS) { e.preventDefault(); z = i; andares(); desenha(); }
    return;
  }
  if (TECLA_FER[k]) {
    ferramenta = TECLA_FER[k];
    marca('.fer', document.querySelector('.fer[data-f="' + ferramenta + '"]'));
    return desenha();
  }
  if (k >= '1' && k <= '6') {
    const b = document.querySelectorAll('.tam')[+k - 1];
    raio = +b.dataset.r; marca('.tam', b);
    return desenha();
  }
  if (TECLA_FMA[k]) {
    forma = TECLA_FMA[k];
    marca('.fma', document.querySelector('.fma[data-m="' + forma + '"]'));
    return desenha();
  }
  if (k === '0') return verTudo();
  if (k === 'v') { vista = vista === 'jogo' ? 'planta' : 'jogo'; return desenha(); }
  if (k === 'l') { luz = luz === 'andar' ? 'neutra' : 'andar'; return desenha(); }
  if (k === 'x') return ciclaGrade();
});
addEventListener('resize', ajusta);
/* Sair com coisa não gravada é a perda mais boba que um editor permite. */
addEventListener('beforeunload', e => { if (mexidos.size + mexidosObj.size) { e.preventDefault(); e.returnValue = ''; } });

paleta();
carregar('varrokgaard');
</script>
