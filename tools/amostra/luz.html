<meta charset="utf-8">
<title>Bancada de luz — quatro modelos</title>
<style>
  body{margin:0;background:#15151a;color:#ddd5c2;font:14px/1.55 "Segoe UI",system-ui,sans-serif;padding:24px}
  h1{font:400 26px/1.1 Cinzel,Georgia,serif;color:#f0cd7a;letter-spacing:.03em;margin:0 0 6px}
  p.lede{color:#8f8874;margin:0 0 18px;max-width:84ch}
  p.lede b{color:#ddd5c2}
  .barra{margin:0 0 18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  label{font-size:13px;color:#8f8874;display:flex;gap:7px;align-items:center}
  select,input{background:#26241f;color:#ddd5c2;border:1px solid #3a352b;padding:4px 8px;font:13px inherit}
  .grade{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
  .cel{background:#1e1c18;border:1px solid #3a352b;padding:13px;width:470px}
  .cel h2{font:600 12px "Segoe UI";letter-spacing:.14em;text-transform:uppercase;color:#d9a441;margin:0 0 4px}
  .cel .nota{color:#8f8874;font-size:12.5px;margin:0 0 9px;min-height:56px}
  .cel .preco{color:#6b6558;font-size:12px;margin:8px 0 0;border-left:2px solid #3a352b;padding-left:9px}
  .cel .preco b{color:#e0705f;font-weight:600}
  canvas{display:block;image-rendering:pixelated;background:#0d0d10;width:444px}
</style>

<h1>Bancada de luz</h1>
<p class="lede">A <b>mesma cena</b> — casa fechada, porta aberta ao sul, tocha acesa dentro, noite —
desenhada quatro vezes. O mundo (chão, parede, porta, boneco) é o <b>do jogo</b>; só o
<b>modelo de luz</b> muda de painel para painel. É a bancada que devia ter existido antes de eu
mexer no motor.</p>

<div class="barra">
  <label>Hora <select id="hora">
    <option value="0.04">madrugada</option><option value="0.20" selected>noite fechada</option>
    <option value="0.78">poente</option><option value="0.5">meio-dia</option></select></label>
  <label>Porta <select id="porta"><option value="1" selected>aberta</option><option value="0">fechada</option></select></label>
  <label>Tocha <input id="tocha" type="range" min="0" max="100" value="85" style="width:120px"></label>
</div>

<div class="grade" id="grade"></div>

<script src="../../src/art.js"></script>
<script src="../../src/world.js"></script>
<script>
/* art.js e world.js e nada mais: o chão, a parede, a porta e o boneco saem do
   PRÓPRIO jogo. O que esta página tem de seu é só o MODELO DE LUZ, que é o que
   ela existe para julgar. */
const $ = s => document.querySelector(s);

/* A cena. `#` parede · `+` porta · `.` chão de dentro · ` ` chão de fora
   · `t` a tocha. Fechada de propósito, com UM vão: é o caso em que o modelo de
   hoje mais obviamente falha — a luz da tocha não sai pela porta e a luz de fora
   não entra por ela. */
const CENA = [
  '                 ',
  '                 ',
  '    ###########  ',
  '    #.........#  ',
  '    #.........#  ',
  '    #.........#  ',
  '    #.........#  ',
  '    #....t....#  ',
  '    #####+#####  ',
  '                 ',
  '                 '
];
const BL_LARG = CENA[0].length, BL_ALT = CENA.length, TL = 32;
const em = (x, y) => (y < 0 || y >= BL_ALT || x < 0 || x >= BL_LARG) ? ' ' : CENA[y][x];
const parede = (x, y) => em(x, y) === '#';
const porta  = (x, y) => em(x, y) === '+';
const veda   = (x, y) => parede(x, y) || (porta(x, y) && !+$('#porta').value);
/* DENTRO é o que as paredes fecham — a mesma pergunta do `calcDentro` do jogo,
   e não "tem telhado". Inundação a partir da borda, com 4 vizinhos: pela
   diagonal ela escaparia por uma quina. Porta conta como parede aberta ou
   fechada, senão abrir a porta encheria a sala de céu. */
function calcDentro() {
  const fora = new Uint8Array(BL_LARG * BL_ALT), fila = [];
  const põe = i => { if (!fora[i] && !parede(i % BL_LARG, (i / BL_LARG) | 0) && !porta(i % BL_LARG, (i / BL_LARG) | 0))
    { fora[i] = 1; fila.push(i); } };
  for (let x = 0; x < BL_LARG; x++) { põe(x); põe((BL_ALT - 1) * BL_LARG + x); }
  for (let y = 0; y < BL_ALT; y++) { põe(y * BL_LARG); põe(y * BL_LARG + BL_LARG - 1); }
  for (let k = 0; k < fila.length; k++) {
    const i = fila[k], x = i % BL_LARG, y = (i / BL_LARG) | 0;
    if (x > 0) põe(i - 1); if (x < BL_LARG - 1) põe(i + 1);
    if (y > 0) põe(i - BL_LARG); if (y < BL_ALT - 1) põe(i + BL_LARG);
  }
  const d = new Uint8Array(BL_LARG * BL_ALT);
  for (let i = 0; i < BL_LARG * BL_ALT; i++) {
    const x = i % BL_LARG, y = (i / BL_LARG) | 0;
    d[i] = (!fora[i] && !parede(x, y) && !porta(x, y)) ? 1 : 0;
  }
  return d;
}
let DENTRO = calcDentro();
const dentro = (x, y) => x >= 0 && y >= 0 && x < BL_LARG && y < BL_ALT && DENTRO[y * BL_LARG + x] === 1;

/* A TOCHA, em px da cena. Uma só: o que se julga aqui é o modelo, e duas fontes
   escondem o defeito de uma atrás da outra. */
const tocha = () => {
  for (let y = 0; y < BL_ALT; y++) for (let x = 0; x < BL_LARG; x++)
    if (em(x, y) === 't') return { x: x * TL + TL / 2, y: y * TL + TL / 2, tx: x, ty: y };
  return null;
};

/* ------------------------------------------------------ o mundo, uma vez --- */
/* Desenhado num canvas à parte e reaproveitado pelos quatro painéis: o que muda
   entre eles é só a luz composta por cima, e redesenhar o mundo em cada um
   convidaria os dois a divergirem. */
let mundoCv = null;
function desenhaMundo() {
  const cv = document.createElement('canvas');
  cv.width = BL_LARG * TL; cv.height = BL_ALT * TL;
  const g = cv.getContext('2d');
  g.imageSmoothingEnabled = false;
  const fora = TILE[T.DIRT], piso = TILE[T.FLOOR_CLARA];
  for (let y = -1; y <= BL_ALT; y++) for (let x = -1; x <= BL_LARG; x++) {
    const d = (dentro(x, y) || porta(x, y)) ? piso : fora;
    const cx = ((x % 3) + 3) % 3 * 32, cy = ((y % 3) + 3) % 3 * 32;
    g.drawImage(tileTexture(d.tex, d.c), cx, cy, 32, 32, x * TL, y * TL, TL, TL);
  }
  const pd = TILE[T.WALL];
  for (let y = 0; y < BL_ALT; y++) for (let x = 0; x < BL_LARG; x++) {
    if (!parede(x, y)) continue;
    const m = (parede(x, y - 1) ? 1 : 0) | (parede(x, y + 1) || porta(x, y + 1) ? 2 : 0)
            | (parede(x - 1, y) || porta(x - 1, y) ? 4 : 0) | (parede(x + 1, y) || porta(x + 1, y) ? 8 : 0);
    const q = ((x % 3) + 3) % 3 + (((y % 3) + 3) % 3) * 3;
    g.drawImage(wallSprite(pd.tex, pd.c, m, 0, q, 0), x * TL, y * TL - WALL_TOP, 32, WALL_H);
  }
  for (let y = 0; y < BL_ALT; y++) for (let x = 0; x < BL_LARG; x++)
    if (porta(x, y)) g.drawImage(portaSprite(+$('#porta').value, 0), x * TL, y * TL - 32, 32, 64);
  // o boneco do jogo, para escala e para se ver como a luz cai nele
  const spr = creatureSprite('biped', 0x8a6a4a, 1.08, { skin: 0xe8c39e });
  const pe = spr.feet || spr.height, cxs = spr.cx !== undefined ? spr.cx : spr.width / 2;
  g.drawImage(spr, 7 * TL + 16 - cxs, 6 * TL + 16 - pe);
  return cv;
}

/* --------------------------------------------------------- os modelos ----- */
const BL_CEU = { '0.04': [26, 30, 52], '0.20': [34, 38, 62], '0.78': [96, 68, 54], '0.5': [255, 250, 236] };
const blCeu = () => BL_CEU[$('#hora').value];
const forcaTocha = () => +$('#tocha').value / 100;
const BL_TOCHA_COR = [255, 176, 92], BL_TOCHA_R = 5.2 * TL;

/* Máscara de abrigo POR TILE, do jeito que o jogo faz hoje. */
function mascaraAbrigo(g) {
  g.fillStyle = '#000';
  for (let y = 0; y < BL_ALT; y++) for (let x = 0; x < BL_LARG; x++)
    if (dentro(x, y) || parede(x, y)) g.fillRect(x * TL, y * TL, TL + 1, TL + 1);
}

function lonaLuz() {
  const cv = document.createElement('canvas');
  cv.width = BL_LARG * TL; cv.height = BL_ALT * TL;
  return cv;
}

/* MODELO 1 — COMO O JOGO FAZ HOJE.
   Ambiente do céu no buffer inteiro, o abrigo como uma máscara preta de 42% com
   BORDA DURA por tile, e o halo da tocha somado por cima. */
function luzHoje(g) {
  const [r, gg, b] = blCeu();
  g.fillStyle = `rgb(${r},${gg},${b})`;
  g.fillRect(0, 0, BL_LARG * TL, BL_ALT * TL);
  const m = lonaLuz(), mg = m.getContext('2d');
  mascaraAbrigo(mg);
  g.globalAlpha = .42; g.drawImage(m, 0, 0); g.globalAlpha = 1;
  const t = tocha();
  if (t && forcaTocha() > 0) {
    const gr = g.createRadialGradient(t.x, t.y, 0, t.x, t.y, BL_TOCHA_R);
    gr.addColorStop(0, `rgba(${BL_TOCHA_COR},${.95 * forcaTocha()})`);
    gr.addColorStop(1, 'rgba(255,176,92,0)');
    g.globalCompositeOperation = 'lighter';
    g.fillStyle = gr; g.fillRect(0, 0, BL_LARG * TL, BL_ALT * TL);
    g.globalCompositeOperation = 'source-over';
  }
}

/* MODELO 2 — PENUMBRA. O mesmo, com a borda da máscara desfocada. Borda dura de
   32 px é o que faz o corte ler como adesivo; luz não tem quina. */
function luzPenumbra(g) {
  const [r, gg, b] = blCeu();
  g.fillStyle = `rgb(${r},${gg},${b})`;
  g.fillRect(0, 0, BL_LARG * TL, BL_ALT * TL);
  const m = lonaLuz(), mg = m.getContext('2d');
  mascaraAbrigo(mg);
  g.globalAlpha = .42;
  if (g.filter !== undefined) g.filter = 'blur(9px)';
  g.drawImage(m, 0, 0);
  if (g.filter !== undefined) g.filter = 'none';
  g.globalAlpha = 1;
  const t = tocha();
  if (t && forcaTocha() > 0) {
    const gr = g.createRadialGradient(t.x, t.y, 0, t.x, t.y, BL_TOCHA_R);
    gr.addColorStop(0, `rgba(${BL_TOCHA_COR},${.95 * forcaTocha()})`);
    gr.addColorStop(1, 'rgba(255,176,92,0)');
    g.globalCompositeOperation = 'lighter';
    g.fillStyle = gr; g.fillRect(0, 0, BL_LARG * TL, BL_ALT * TL);
    g.globalCompositeOperation = 'source-over';
  }
}

/* MODELO 3 — LUZ QUE ENTRA E SAI PELO VÃO, ainda em 2D.
   A tocha deixa de ser um disco e passa a ser um LEQUE recortado pela parede:
   raios saindo da fonte, cada um parando no primeiro tile que veda. É o que faz
   a luz sair pela porta e desenhar a mancha no chão de fora. */
function leque(g, fx, fy, raio, cor, forca) {
  const N = 720;
  g.save();
  g.beginPath(); g.moveTo(fx, fy);
  for (let i = 0; i <= N; i++) {
    const a = i / N * Math.PI * 2;
    const dx = Math.cos(a), dy = Math.sin(a);
    let d = 0;
    /* Marcha em passos de meio tile: para no primeiro tile que veda, e é isso
       que dá o recorte da parede sem custar um buffer de sombra. */
    while (d < raio) {
      d += TL * .34;
      const tx = ((fx + dx * d) / TL) | 0, ty = ((fy + dy * d) / TL) | 0;
      if (veda(tx, ty)) break;
    }
    g.lineTo(fx + dx * Math.min(d, raio), fy + dy * Math.min(d, raio));
  }
  g.closePath(); g.clip();
  const gr = g.createRadialGradient(fx, fy, 0, fx, fy, raio);
  gr.addColorStop(0, `rgba(${cor},${.95 * forca})`);
  gr.addColorStop(1, `rgba(${cor},0)`);
  g.globalCompositeOperation = 'lighter';
  g.fillStyle = gr; g.fillRect(0, 0, BL_LARG * TL, BL_ALT * TL);
  g.restore();
}
function luzVao(g) {
  const [r, gg, b] = blCeu();
  g.fillStyle = `rgb(${r},${gg},${b})`;
  g.fillRect(0, 0, BL_LARG * TL, BL_ALT * TL);
  const m = lonaLuz(), mg = m.getContext('2d');
  mascaraAbrigo(mg);
  g.globalAlpha = .42;
  if (g.filter !== undefined) g.filter = 'blur(9px)';
  g.drawImage(m, 0, 0);
  if (g.filter !== undefined) g.filter = 'none';
  g.globalAlpha = 1;
  const t = tocha();
  if (t && forcaTocha() > 0) leque(g, t.x, t.y, BL_TOCHA_R, BL_TOCHA_COR, forcaTocha());
}

/* MODELO 4 — WEBGL, por pixel.
   Aqui a luz deixa de ser uma pilha de camadas e passa a ser CONTA: para cada
   pixel, a distância até a fonte, a atenuação, e uma marcha até ela pela textura
   de oclusão. Penumbra e sombra saem da mesma conta, sem máscara nem desfoque —
   e é isso que separa "luz" de "adesivo".
   O buffer sai como TEXTURA e o canvas 2D compõe por cima, exatamente como já
   faz com o buffer de luz de hoje: o resto do jogo não muda. */
const VS = `attribute vec2 p; varying vec2 uv;
void main(){ uv = p * .5 + .5; uv.y = 1. - uv.y; gl_Position = vec4(p, 0., 1.); }`;
const FS = `precision highp float;
varying vec2 uv;
uniform sampler2D occ;      // 1 onde veda a luz
uniform sampler2D abr;      // 1 onde e abrigado do ceu
uniform vec2 res;
uniform vec3 amb;           // cor do ceu
uniform vec3 luzCor;
uniform vec2 luzPos;        // em uv
uniform float luzR;         // raio em uv
uniform float luzF;
float vedado(vec2 a, vec2 b){
  /* Marcha de A ate B pela textura de oclusao. 32 passos: com menos, a sombra
     serrilha em parede diagonal; com mais, nao muda nada visivel. */
  const int N = 32;
  vec2 d = (b - a) / float(N);
  for (int i = 1; i < N; i++) {
    vec2 p = a + d * float(i);
    if (texture2D(occ, p).r > .5) return 0.;
  }
  return 1.;
}
void main(){
  /* O ceu chega atenuado onde ha abrigo, e o valor vem da TEXTURA interpolada —
     e a interpolacao e que da a penumbra de graca, sem desfoque nenhum. */
  float coberto = texture2D(abr, uv).r;
  vec3 col = amb * mix(1., .30, coberto);
  vec2 dl = (luzPos - uv) * vec2(res.x / res.y, 1.);
  float dist = length(dl) / luzR;
  float att = clamp(1. - dist, 0., 1.);
  att *= att;
  if (att > 0.001) col += luzCor * att * luzF * vedado(uv, luzPos);
  gl_FragColor = vec4(col, 1.);
}`;
function compila(gl, tipo, src) {
  const s = gl.createShader(tipo); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
let glCv = null, glProg = null, glCtx = null;
function luzWebgl(g) {
  if (!glCv) {
    glCv = document.createElement('canvas');
    glCv.width = BL_LARG * TL; glCv.height = BL_ALT * TL;
    glCtx = glCv.getContext('webgl', { antialias: false, preserveDrawingBuffer: true });
    if (glCtx) {
      const pr = glCtx.createProgram();
      glCtx.attachShader(pr, compila(glCtx, glCtx.VERTEX_SHADER, VS));
      glCtx.attachShader(pr, compila(glCtx, glCtx.FRAGMENT_SHADER, FS));
      glCtx.linkProgram(pr);
      if (!glCtx.getProgramParameter(pr, glCtx.LINK_STATUS)) throw new Error(glCtx.getProgramInfoLog(pr));
      glCtx.useProgram(pr); glProg = pr;
      const buf = glCtx.createBuffer();
      glCtx.bindBuffer(glCtx.ARRAY_BUFFER, buf);
      glCtx.bufferData(glCtx.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), glCtx.STATIC_DRAW);
      const loc = glCtx.getAttribLocation(pr, 'p');
      glCtx.enableVertexAttribArray(loc);
      glCtx.vertexAttribPointer(loc, 2, glCtx.FLOAT, false, 0, 0);
    }
  }
  const gl = glCtx;
  if (!gl) { g.fillStyle = '#400'; g.fillRect(0, 0, BL_LARG * TL, BL_ALT * TL); return; }
  /* As duas texturas de entrada: quem VEDA e quem é ABRIGADO. Uma por tile, e
     `LINEAR` de propósito — a interpolação entre tiles é a penumbra. */
  const mk = (unidade, nome, teste, filtro) => {
    const cv = document.createElement('canvas');
    cv.width = BL_LARG; cv.height = BL_ALT;
    const c = cv.getContext('2d');
    const im = c.createImageData(BL_LARG, BL_ALT);
    for (let y = 0; y < BL_ALT; y++) for (let x = 0; x < BL_LARG; x++) {
      const v = teste(x, y) ? 255 : 0, i = (y * BL_LARG + x) * 4;
      im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255;
    }
    c.putImageData(im, 0, 0);
    const tex = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0 + unidade);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cv);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filtro);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filtro);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.uniform1i(gl.getUniformLocation(glProg, nome), unidade);
  };
  mk(0, 'occ', (x, y) => veda(x, y), gl.NEAREST);
  mk(1, 'abr', (x, y) => dentro(x, y) || parede(x, y), gl.LINEAR);
  const [r, gg, b] = blCeu(), t = tocha();
  const U = n => gl.getUniformLocation(glProg, n);
  gl.uniform2f(U('res'), BL_LARG * TL, BL_ALT * TL);
  gl.uniform3f(U('amb'), r / 255, gg / 255, b / 255);
  gl.uniform3f(U('luzCor'), BL_TOCHA_COR[0] / 255, BL_TOCHA_COR[1] / 255, BL_TOCHA_COR[2] / 255);
  gl.uniform2f(U('luzPos'), t ? t.x / (BL_LARG * TL) : -1, t ? t.y / (BL_ALT * TL) : -1);
  gl.uniform1f(U('luzR'), BL_TOCHA_R / (BL_LARG * TL) * (BL_LARG * TL) / (BL_ALT * TL) * 1.0);
  gl.uniform1f(U('luzF'), forcaTocha());
  gl.viewport(0, 0, BL_LARG * TL, BL_ALT * TL);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  g.drawImage(glCv, 0, 0);
}

/* --------------------------------------------------------------- montar --- */
const MODELOS = [
  ['1 — como o jogo faz hoje', luzHoje,
   'Ambiente do céu no buffer inteiro, abrigo como máscara preta de 42% com BORDA DURA por tile, halo da tocha somado por cima.',
   'O corte do abrigo tem quina de 32 px e a tocha é um DISCO: ela atravessa a parede e não sai pela porta.'],
  ['2 — penumbra', luzPenumbra,
   'O mesmo, com a borda do abrigo desfocada. Uma linha de código no motor.',
   'Some a quina, mas a tocha continua sendo um disco que atravessa parede.'],
  ['3 — luz pelo vão, ainda em 2D', luzVao,
   'A tocha vira um LEQUE recortado pela parede: raios que param no primeiro tile que veda. A luz sai pela porta.',
   'Custa uma marcha de 720 raios por fonte, por quadro. Com muitas tochas isso pesa, e a penumbra continua sendo desfoque, não conta.'],
  ['4 — WebGL, por pixel', luzWebgl,
   'A luz vira CONTA: distância, atenuação e uma marcha de oclusão por pixel. Penumbra e sombra saem da mesma conta, sem máscara nem desfoque.',
   'Traz uma segunda tecnologia para o projeto. Só o BUFFER DE LUZ mudaria — o mundo, os sprites e a fita de teste continuam em 2D.']
];

function monta() {
  DENTRO = calcDentro();
  mundoCv = desenhaMundo();
  $('#grade').innerHTML = '';
  for (const [titulo, fn, nota, preco] of MODELOS) {
    const d = document.createElement('div');
    d.className = 'cel';
    d.innerHTML = `<h2>${titulo}</h2><p class="nota">${nota}</p>`;
    const cv = document.createElement('canvas');
    cv.width = BL_LARG * TL; cv.height = BL_ALT * TL;
    d.appendChild(cv);
    d.insertAdjacentHTML('beforeend', `<p class="preco"><b>O preço:</b> ${preco}</p>`);
    $('#grade').appendChild(d);
    const g = cv.getContext('2d');
    g.imageSmoothingEnabled = false;
    g.drawImage(mundoCv, 0, 0);
    /* A LUZ MULTIPLICA o mundo, que é como o jogo compõe hoje: multiply só
       SUBTRAI, então o buffer nunca clareia o que a arte não tem. */
    const lz = lonaLuz();
    try { fn(lz.getContext('2d')); }
    catch (e) { const c2 = lz.getContext('2d'); c2.fillStyle = '#600'; c2.fillRect(0,0,lz.width,lz.height);
                console.error(titulo, e); }
    g.globalCompositeOperation = 'multiply';
    g.drawImage(lz, 0, 0);
    g.globalCompositeOperation = 'source-over';
  }
}
$('#hora').onchange = $('#porta').onchange = monta;
$('#tocha').oninput = monta;
monta();
</script>
