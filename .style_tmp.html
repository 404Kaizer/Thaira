<style>
  :root{
    --ink:#0b0c0f; --surface:#15151a; --surface2:#1e1c18; --raise:#26241f;
    --line:#3a352b; --line-soft:#2a261f;
    --txt:#ddd5c2; --dim:#8f8874; --mute:#6b6558;
    --gold:#d9a441; --gold2:#f0cd7a;
    --done:#7fd08a; --wait:#e0a05a; --warn:#e0705f;
    --serif:"Cinzel","Trajan Pro",Georgia,"Times New Roman",serif;
    --sans:"Segoe UI",system-ui,-apple-system,sans-serif;
    --mono:ui-monospace,"Cascadia Code",Consolas,"DejaVu Sans Mono",monospace;
    --measure:74ch;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --ink:#dcd8ce; --surface:#e6e3da; --surface2:#eeebe3; --raise:#f4f2ec;
      --line:#bdb6a6; --line-soft:#cdc7b9;
      --txt:#231f18; --dim:#5f5849; --mute:#7c7566;
      --gold:#7d5a15; --gold2:#5e430f;
      --done:#2f6b3c; --wait:#8a5610; --warn:#9b3226;
    }
  }
  :root[data-theme="light"]{
    --ink:#dcd8ce; --surface:#e6e3da; --surface2:#eeebe3; --raise:#f4f2ec;
    --line:#bdb6a6; --line-soft:#cdc7b9;
    --txt:#231f18; --dim:#5f5849; --mute:#7c7566;
    --gold:#7d5a15; --gold2:#5e430f;
    --done:#2f6b3c; --wait:#8a5610; --warn:#9b3226;
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--txt);font:16px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1000px;margin:0 auto;padding:0 24px 96px}
  .col{max-width:var(--measure)}
  h1,h2,h3,h4{text-wrap:balance;margin:0}
  a{color:var(--gold2)}
  :focus-visible{outline:2px solid var(--gold);outline-offset:3px}

  header{padding:64px 0 36px;border-bottom:1px solid var(--line)}
  .eyebrow{font:600 11px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-bottom:18px}
  h1{font:400 clamp(32px,5.5vw,50px)/1.08 var(--serif);letter-spacing:.03em;color:var(--gold2)}
  .lede{margin-top:20px;color:var(--dim);font-size:17px}
  .lede b{color:var(--txt);font-weight:600}

  section{padding:48px 0;border-bottom:1px solid var(--line-soft)}
  section:last-of-type{border-bottom:0}
  h2{font:600 12px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);
     margin-bottom:22px;display:flex;align-items:center;gap:12px}
  h2::after{content:"";flex:1;height:1px;background:var(--line-soft)}
  h3{font:600 17px/1.4 var(--sans);color:var(--txt);margin:26px 0 8px}
  h3:first-child{margin-top:0}
  h4{font:600 14px var(--sans);color:var(--gold2);margin:18px 0 6px}
  p{margin:0 0 14px;max-width:var(--measure)}
  p:last-child{margin-bottom:0}
  strong{color:var(--gold2);font-weight:600}
  code{font:0.87em var(--mono);background:var(--surface2);border:1px solid var(--line-soft);
       border-radius:3px;padding:1px 5px;color:var(--txt);white-space:nowrap}
  ul,ol{max-width:var(--measure);margin:0 0 14px;padding-left:20px}
  li{margin-bottom:6px}

  .band{overflow-x:auto;margin:0 -4px 8px}
  table{border-collapse:collapse;width:100%;min-width:540px;font-variant-numeric:tabular-nums}
  caption{text-align:left;color:var(--mute);font-size:13px;padding-bottom:10px}
  th,td{padding:9px 13px;text-align:left;border-bottom:1px solid var(--line-soft);vertical-align:top}
  thead th{font:600 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);
           border-bottom:1px solid var(--line)}
  tbody th{font:400 14px var(--sans);color:var(--txt);font-weight:500}
  td{font-size:14px;color:var(--dim)}
  td.n{font-family:var(--mono);font-size:13.5px}
  td.now{color:var(--gold2);font-family:var(--mono);font-size:13.5px}
  td.delta{color:var(--done);font-size:13px}

  .fases{display:grid;gap:2px;background:var(--line-soft);border:1px solid var(--line-soft);margin-bottom:8px}
  .fase{background:var(--surface);padding:20px 22px;display:grid;grid-template-columns:auto 1fr;gap:18px}
  .num{font:400 13px var(--mono);color:var(--gold);padding:3px 18px 0 0;border-right:1px solid var(--line-soft)}
  .fase p,.fase li{color:var(--dim);font-size:14.5px}
  .why{margin-top:10px;padding-left:14px;border-left:2px solid var(--line);color:var(--mute);
       font-size:13.5px;font-style:italic}

  .fix{background:var(--surface);border:1px solid var(--line-soft);border-left:2px solid var(--done);
       padding:16px 20px;margin-bottom:2px}
  .fix h4{margin-top:0}
  .fix p{font-size:14px;color:var(--dim);margin-bottom:8px}
  .causa{font-size:13.5px;color:var(--mute)}
  .causa b{color:var(--warn);font-weight:600}

  .grupo{margin-bottom:28px}
  .gtitle{font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
  ul.itens{list-style:none;margin:0;padding:0;display:grid;gap:2px;max-width:none}
  ul.itens li{background:var(--surface);border-left:2px solid var(--wait);padding:13px 18px;
              display:grid;gap:4px;margin:0}
  ul.itens li.debt{border-left-color:var(--mute)}
  .it-n{font:600 15px var(--sans);color:var(--txt)}
  .it-d{font-size:13.5px;color:var(--dim)}
  .it-t{font-size:12.5px;color:var(--mute);font-family:var(--mono)}

  /* Selo de estado. Retangular e sem preenchimento: é rótulo, não botão. */
  .tag{font:600 10px var(--sans);letter-spacing:.09em;text-transform:uppercase;
       padding:2px 6px;border:1px solid var(--line);border-radius:2px;
       white-space:nowrap;margin-left:6px}
  .tag.warn{color:var(--warn);border-color:var(--warn)}
  .tag.wait{color:var(--wait);border-color:var(--wait)}
  .tag.done{color:var(--done);border-color:var(--done)}
  ul.itens li.feito{border-left-color:var(--done)}
  /* Na lista de invariantes (ul simples, com marcador), o que entrou nesta leva
     ganha o marcador em verde — some no meio das 30 antigas sem isso. */
  li.feito::marker{color:var(--done)}

  .aviso{background:var(--surface2);border:1px solid var(--line);border-left:3px solid var(--warn);
         padding:18px 20px;margin-bottom:14px;max-width:var(--measure)}
  .aviso h4{color:var(--warn);margin-top:0}
  .aviso p{font-size:14px;color:var(--dim)}

  footer{padding:36px 0 0;color:var(--mute);font-size:13px;border-top:1px solid var(--line)}

  @media (max-width:640px){
    .fase{grid-template-columns:1fr;gap:10px}
    .num{border-right:0;border-bottom:1px solid var(--line-soft);padding:0 0 8px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
